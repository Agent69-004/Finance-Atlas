<title>Finance 69</title>
<meta name="claude:viewport-fit-sides" content="cover" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap"
/>
<style>
  /* Layout concept: a bright living map. Seven constellations of subjects float around a hub on a canvas that drifts with color;
   ribbons along the bottom edge are the seven areas as currents and thicken as you progress. The ledger sits right, a subject opens as a folio. */
  :root {
    --bg: #f5f6fb;
    --bg2: #ebedf6;
    --card: #ffffff;
    --ink: #12131a;
    --mute: #5c6177;
    --faint: #a4a9be;
    --rule: rgba(18, 19, 26, 0.09);
    --rule2: rgba(18, 19, 26, 0.18);
    --glass: rgba(255, 255, 255, 0.74);
    --halo: #f5f6fb;
    --shadow: rgba(40, 52, 120, 0.22);
    --acc: #ff6b2c;
    --good: #13a24b;
    --bad: #e5484d;
    --c1: #ff9f1c;
    --c2: #12b5a6;
    --c3: #7b61ff;
    --c4: #2d7ff9;
    --c5: #ff5c77;
    --c6: #22c55e;
    --c7: #d946ef;
    --serif: "Instrument Serif", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    --sans: "Geist", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
    --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    --spring: cubic-bezier(0.34, 1.5, 0.4, 1);
    --gx: max(16px, env(safe-area-inset-left, 0px));
    --gxr: max(16px, env(safe-area-inset-right, 0px));
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b0c12;
      --bg2: #12141d;
      --card: #161824;
      --ink: #eceef8;
      --mute: #9399b0;
      --faint: #4c5066;
      --rule: rgba(236, 238, 248, 0.1);
      --rule2: rgba(236, 238, 248, 0.2);
      --glass: rgba(16, 18, 28, 0.72);
      --halo: #0b0c12;
      --shadow: rgba(0, 0, 0, 0.55);
      --acc: #ffb020;
      --good: #4ade80;
      --bad: #ff7a90;
      --c1: #ffb020;
      --c2: #2dd4bf;
      --c3: #9b87ff;
      --c4: #4c9aff;
      --c5: #ff7a90;
      --c6: #4ade80;
      --c7: #e879f9;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b0c12;
    --bg2: #12141d;
    --card: #161824;
    --ink: #eceef8;
    --mute: #9399b0;
    --faint: #4c5066;
    --rule: rgba(236, 238, 248, 0.1);
    --rule2: rgba(236, 238, 248, 0.2);
    --glass: rgba(16, 18, 28, 0.72);
    --halo: #0b0c12;
    --shadow: rgba(0, 0, 0, 0.55);
    --acc: #ffb020;
    --good: #4ade80;
    --bad: #ff7a90;
    --c1: #ffb020;
    --c2: #2dd4bf;
    --c3: #9b87ff;
    --c4: #4c9aff;
    --c5: #ff7a90;
    --c6: #4ade80;
    --c7: #e879f9;
    color-scheme: dark;
  }
  html.tx *,
  html.tx *::before,
  html.tx *::after {
    transition:
      background-color 0.6s,
      color 0.6s,
      border-color 0.6s,
      fill 0.6s,
      stroke 0.6s !important;
  }

  html,
  body {
    height: 100%;
  }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    overflow: hidden;
  }
  * {
    box-sizing: border-box;
  }
  button,
  input,
  select,
  textarea {
    font: inherit;
    color: inherit;
  }
  button {
    cursor: pointer;
    background: none;
    border: 0;
    padding: 0;
    touch-action: manipulation;
  }
  :focus-visible {
    outline: 2px solid var(--acc);
    outline-offset: 3px;
    border-radius: 4px;
  }
  ::selection {
    background: var(--acc);
    color: #fff;
  }
  .mono {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
  }
  .eyebrow {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--mute);
  }
  .serif {
    font-family: var(--serif);
    font-weight: 400;
  }

  .app {
    position: fixed;
    inset: 0;
    background: var(--bg);
    color: var(--ink);
    overflow: hidden;
  }
  #bg,
  #fx {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    display: block;
  }
  #bg {
    z-index: 0;
  }
  #fx {
    z-index: 90;
  }
  .spot {
    position: absolute;
    left: 0;
    top: 0;
    width: 560px;
    height: 560px;
    margin: -280px 0 0 -280px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 1;
    background: radial-gradient(
      circle,
      color-mix(in srgb, var(--acc) 16%, transparent),
      transparent 62%
    );
    opacity: 0;
    transition: opacity 0.8s;
    will-change: transform;
  }
  .spot.on {
    opacity: 1;
  }
  .map {
    position: absolute;
    inset: 0;
    z-index: 2;
    width: 100%;
    height: 100%;
    display: block;
    cursor: grab;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    transition: opacity 0.6s var(--ease);
  }
  .map.drag {
    cursor: grabbing;
  }
  .scrim {
    position: absolute;
    inset: 0;
    z-index: 35;
    background: color-mix(in srgb, var(--bg) 38%, transparent);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.7s var(--ease);
  }
  .app.open .scrim {
    opacity: 1;
    pointer-events: auto;
  }

  /* map elements */
  .edge {
    fill: none;
    stroke: color-mix(in srgb, var(--ink) 26%, transparent);
    stroke-width: 1.2;
    stroke-dasharray: 3 8;
    stroke-linecap: round;
    animation: flow 1.8s linear infinite;
    transition: stroke 0.3s;
  }
  .edge.hi {
    stroke: var(--ink);
    stroke-width: 2;
    stroke-dasharray: none;
    animation: none;
  }
  .spoke {
    fill: none;
    stroke: var(--rule2);
    stroke-width: 1;
    stroke-dasharray: 2 7;
  }
  .hub-ring {
    fill: none;
    stroke: var(--rule2);
    stroke-width: 1;
  }
  .hub-core {
    fill: var(--card);
    stroke: var(--rule2);
    stroke-width: 1;
  }
  .hub-breathe {
    fill: none;
    stroke: var(--acc);
    stroke-width: 1.5;
    transform-box: fill-box;
    transform-origin: center;
    animation: breathe 3.6s ease-out infinite;
  }
  .orbit {
    transform-origin: 0 0;
    animation: spin 46s linear infinite;
  }
  .orbit.r {
    animation-direction: reverse;
    animation-duration: 70s;
  }
  .hub-t1 {
    font-family: var(--serif);
    font-style: italic;
    font-size: 26px;
    fill: var(--ink);
    text-anchor: middle;
  }
  .hub-t2 {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.14em;
    fill: var(--mute);
    text-anchor: middle;
    text-transform: uppercase;
  }
  .cl-name {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    fill: var(--mute);
    text-anchor: middle;
  }
  .cl-pct {
    font-family: var(--serif);
    font-size: 36px;
    fill: color-mix(in srgb, var(--dc) 72%, var(--ink));
    text-anchor: middle;
  }
  .node {
    cursor: pointer;
    outline: none;
    transition: opacity 0.5s;
  }
  .node .fl {
    animation: bob var(--bd, 7s) ease-in-out var(--bl, 0s) infinite alternate;
  }
  .node:hover .fl,
  .node.sel .fl,
  .node:focus-visible .fl {
    animation-play-state: paused;
  }
  .node .in {
    animation: pop 1s var(--spring) backwards;
    transform-box: fill-box;
    transform-origin: center;
    transition: transform 0.5s var(--spring);
  }
  .node:hover .in,
  .node:focus-visible .in {
    transform: scale(1.13);
  }
  .node.sel .in {
    transform: scale(1.18);
  }
  .node .halo {
    fill: var(--dc);
    opacity: 0;
    transition: opacity 0.35s;
    transform-box: fill-box;
    transform-origin: center;
  }
  .node:hover .halo,
  .node:focus-visible .halo,
  .node.sel .halo {
    opacity: 0.2;
  }
  .node.next .halo {
    animation: pulseHalo 2.4s ease-out infinite;
  }
  .node .base {
    fill: var(--card);
    stroke: var(--rule2);
    stroke-width: 1.5;
    transition: fill 0.5s;
  }
  .node[data-l="1"] .base {
    stroke: color-mix(in srgb, var(--ink) 42%, transparent);
  }
  .node[data-l="3"] .base {
    stroke-dasharray: 3 4;
  }
  .node.mastered .base {
    fill: color-mix(in srgb, var(--dc) 22%, var(--card));
  }
  .node .ring {
    fill: none;
    stroke: var(--dc);
    stroke-width: 4;
    stroke-linecap: round;
    transition: stroke-dasharray 1.2s var(--ease);
  }
  .node .nn {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 500;
    fill: var(--ink);
    text-anchor: middle;
  }
  .node .nl {
    font-family: var(--serif);
    font-style: italic;
    font-size: 22px;
    fill: var(--ink);
    text-anchor: middle;
    paint-order: stroke;
    stroke: var(--halo);
    stroke-width: 5px;
    stroke-linejoin: round;
    transition: fill 0.3s;
  }
  .node .nm {
    font-family: var(--mono);
    font-size: 10.5px;
    fill: var(--mute);
    text-anchor: middle;
    paint-order: stroke;
    stroke: var(--halo);
    stroke-width: 4px;
  }
  .node:hover .nl,
  .node.sel .nl {
    fill: color-mix(in srgb, var(--dc) 70%, var(--ink));
  }
  .rip {
    fill: none;
    stroke: var(--dc);
    stroke-width: 3;
    transform-box: fill-box;
    transform-origin: center;
    animation: rip 1.2s ease-out forwards;
  }
  .map[data-f="1"] .node:not([data-l="1"]),
  .map[data-f="2"] .node:not([data-l="2"]),
  .map[data-f="3"] .node:not([data-l="3"]) {
    opacity: 0.14;
  }

  /* tooltip */
  .tip {
    position: absolute;
    left: 0;
    top: 0;
    z-index: 30;
    pointer-events: none;
    width: 230px;
    padding: 12px 14px;
    background: var(--glass);
    border: 1px solid var(--rule2);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-radius: 14px;
    box-shadow: 0 18px 40px -18px var(--shadow);
    opacity: 0;
    transition: opacity 0.25s;
    will-change: transform;
  }
  .tip.on {
    opacity: 1;
  }
  .tip .t1 {
    font-family: var(--serif);
    font-style: italic;
    font-size: 21px;
    line-height: 1.05;
  }
  .tip .t2 {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--mute);
    margin-top: 5px;
    display: flex;
    justify-content: space-between;
    gap: 10px;
  }
  .tip .t2 b {
    color: var(--ink);
    font-weight: 500;
  }
  .tip ul {
    list-style: none;
    margin: 9px 0 0;
    padding: 9px 0 0;
    border-top: 1px solid var(--rule);
    font-size: 12px;
    color: var(--mute);
    line-height: 1.4;
  }
  .tip li {
    padding: 2px 0;
  }
  .tip li::before {
    content: "";
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--dc);
    margin-right: 8px;
    vertical-align: 1px;
  }
  .tip .t3 {
    margin-top: 8px;
    font-size: 12px;
    color: var(--good);
  }

  /* top */
  .top {
    position: absolute;
    z-index: 20;
    top: calc(16px + env(safe-area-inset-top, 0px));
    left: var(--gx);
    right: var(--gxr);
    display: flex;
    align-items: center;
    gap: 16px;
    pointer-events: none;
  }
  .top > * {
    pointer-events: auto;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }
  .logo {
    width: 34px;
    height: 34px;
    flex: none;
    border-radius: 11px;
    background: var(--ink);
    display: grid;
    place-items: center;
    overflow: hidden;
  }
  .logo svg {
    width: 26px;
    height: 26px;
  }
  .logo path {
    fill: none;
    stroke-width: 2.6;
    stroke-linecap: round;
    stroke-dasharray: 18 6;
    animation: flow 2.4s linear infinite;
  }
  .brand b {
    font-family: var(--serif);
    font-size: 30px;
    font-weight: 400;
    letter-spacing: -0.01em;
    line-height: 1;
    white-space: nowrap;
    display: flex;
  }
  .brand b span {
    display: inline-block;
    animation: letter 1s var(--ease) backwards;
    animation-delay: calc(var(--i) * 38ms + 150ms);
  }
  .brand em {
    font-family: var(--mono);
    font-style: normal;
    font-size: 10.5px;
    color: var(--mute);
    letter-spacing: 0.08em;
    white-space: nowrap;
  }
  .modes {
    margin: 0 auto;
    display: flex;
    gap: 2px;
    padding: 3px;
    border: 1px solid var(--rule2);
    border-radius: 99px;
    background: var(--glass);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    position: relative;
    box-shadow: 0 10px 30px -16px var(--shadow);
  }
  .modes button {
    position: relative;
    z-index: 1;
    height: 30px;
    padding: 0 16px;
    border-radius: 99px;
    font-size: 12.5px;
    color: var(--mute);
    transition: color 0.4s;
  }
  .modes button[aria-pressed="true"] {
    color: var(--bg);
  }
  .modes .ink {
    position: absolute;
    top: 3px;
    bottom: 3px;
    left: 0;
    border-radius: 99px;
    background: var(--ink);
    transition:
      left 0.7s var(--spring),
      width 0.7s var(--spring);
  }
  .tright {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .sync {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--mute);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .sync i {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--faint);
  }
  .sync[data-s="synced"] i {
    background: var(--good);
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--good) 20%, transparent);
  }
  .sync[data-s="saving"] i {
    background: var(--acc);
    animation: blink 0.7s infinite;
  }
  .sync[data-s="local"] i {
    background: var(--mute);
  }
  .ibtn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid var(--rule2);
    background: var(--glass);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    display: grid;
    place-items: center;
    transition:
      border-color 0.3s,
      transform 0.5s var(--spring);
  }
  .ibtn:hover {
    border-color: var(--ink);
    transform: rotate(30deg) scale(1.06);
  }
  .ibtn svg {
    width: 15px;
    height: 15px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* canvas tools */
  .tools {
    position: absolute;
    z-index: 15;
    left: var(--gx);
    bottom: calc(22px + env(safe-area-inset-bottom, 0px));
    display: flex;
    flex-direction: column;
    gap: 12px;
    align-items: flex-start;
    transition: opacity 0.5s;
  }
  .zoom {
    display: flex;
    gap: 6px;
  }
  .zoom button {
    height: 34px;
    min-width: 34px;
    padding: 0 12px;
    border-radius: 99px;
    border: 1px solid var(--rule2);
    background: var(--glass);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    font-family: var(--mono);
    font-size: 12px;
    transition:
      border-color 0.3s,
      transform 0.4s var(--spring);
  }
  .zoom button:hover {
    border-color: var(--ink);
    transform: translateY(-2px);
  }
  .zoom button:active {
    transform: scale(0.92);
  }
  .legend {
    display: flex;
    gap: 6px;
    align-items: center;
    flex-wrap: wrap;
  }
  .legend .eyebrow {
    margin-right: 4px;
  }
  .fbtn {
    height: 28px;
    padding: 0 12px;
    border-radius: 99px;
    border: 1px solid var(--rule2);
    background: var(--glass);
    font-size: 12px;
    color: var(--mute);
    transition: all 0.35s var(--ease);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  .fbtn:hover {
    border-color: var(--ink);
    color: var(--ink);
  }
  .fbtn[aria-pressed="true"] {
    background: var(--ink);
    color: var(--bg);
    border-color: var(--ink);
  }
  .hint {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--mute);
    letter-spacing: 0.06em;
  }

  /* ledger */
  .ledger {
    position: absolute;
    z-index: 10;
    right: var(--gxr);
    top: calc(68px + env(safe-area-inset-top, 0px));
    bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    width: 340px;
    display: flex;
    flex-direction: column;
    padding: 20px 18px 0;
    border: 1px solid var(--rule2);
    border-radius: 22px;
    background: var(--glass);
    backdrop-filter: blur(18px) saturate(1.3);
    -webkit-backdrop-filter: blur(18px) saturate(1.3);
    box-shadow: 0 30px 60px -34px var(--shadow);
    transition:
      opacity 0.6s var(--ease),
      transform 0.8s var(--ease);
    animation: slideIn 1.1s var(--ease) 0.25s backwards;
  }
  .big {
    margin-top: 4px;
    font-family: var(--serif);
    font-size: 92px;
    line-height: 0.82;
    letter-spacing: -0.04em;
    display: flex;
    align-items: flex-start;
    gap: 4px;
  }
  .big sup {
    font-size: 0.26em;
    letter-spacing: 0;
    margin-top: 0.3em;
    color: var(--mute);
    font-style: italic;
  }
  .sb {
    display: flex;
    gap: 3px;
    height: 7px;
    margin: 14px 0 10px;
  }
  .sb i {
    flex: var(--t) 1 0;
    background: var(--rule);
    position: relative;
    border-radius: 4px;
    overflow: hidden;
  }
  .sb i b {
    position: absolute;
    inset: 0 auto 0 0;
    width: var(--w, 0%);
    background: var(--dc);
    border-radius: 4px;
    transition: width 1.4s var(--ease);
  }
  .subl {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--mute);
    line-height: 1.6;
  }
  .next {
    margin-top: 10px;
    display: flex;
    align-items: baseline;
    gap: 8px;
    flex-wrap: wrap;
    font-size: 12.5px;
    color: var(--mute);
  }
  .next button {
    font-family: var(--serif);
    font-style: italic;
    font-size: 20px;
    color: var(--ink);
    text-decoration: underline;
    text-decoration-thickness: 1.5px;
    text-underline-offset: 4px;
    text-decoration-color: var(--acc);
    transition: letter-spacing 0.4s var(--ease);
  }
  .next button:hover {
    letter-spacing: 0.01em;
  }
  .sess {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    gap: 12px;
    align-items: center;
    margin-top: 14px;
    padding: 10px 12px 10px 10px;
    border-radius: 18px;
    background: color-mix(in srgb, var(--ink) 5%, transparent);
    border: 1px solid var(--rule);
  }
  .sring {
    position: relative;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    transition: transform 0.5s var(--spring);
  }
  .sring:hover {
    transform: scale(1.07);
  }
  .sring:active {
    transform: scale(0.94);
  }
  .sring svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .sbg {
    fill: none;
    stroke: var(--rule2);
    stroke-width: 4;
  }
  .sfg {
    fill: none;
    stroke: var(--acc);
    stroke-width: 4;
    stroke-linecap: round;
    stroke-dasharray: 0 176;
    transition: stroke-dasharray 0.6s linear;
  }
  .sico {
    position: relative;
    width: 16px;
    height: 16px;
    display: grid;
    place-items: center;
  }
  .sico svg {
    position: static;
    width: 16px;
    height: 16px;
    fill: var(--ink);
  }
  .sess.run .sring {
    animation: ringPulse 2.4s ease-out infinite;
  }
  .sname {
    font-family: var(--serif);
    font-size: 21px;
    line-height: 1.05;
    margin-top: 2px;
  }
  .sess .subl {
    margin-top: 2px;
  }
  .idx {
    margin-top: 16px;
    padding-top: 12px;
    border-top: 1px solid var(--rule);
  }
  .areas {
    list-style: none;
    margin: 6px 0 0;
    padding: 0 0 30px;
    overflow: auto;
    flex: 1;
    scrollbar-width: none;
    mask-image: linear-gradient(#000 calc(100% - 30px), transparent);
    -webkit-mask-image: linear-gradient(#000 calc(100% - 30px), transparent);
  }
  .areas::-webkit-scrollbar {
    display: none;
  }
  .areas li {
    border-bottom: 1px solid var(--rule);
    padding: 12px 0;
    animation: rise 0.9s var(--ease) backwards;
    animation-delay: calc(var(--i) * 70ms + 400ms);
  }
  .a-row {
    display: grid;
    grid-template-columns: 22px minmax(0, 1fr) auto;
    gap: 10px;
    align-items: baseline;
  }
  .a-row .ix {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--faint);
  }
  .a-row .nm {
    font-family: var(--serif);
    font-size: 22px;
    line-height: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .a-row .pc {
    font-family: var(--mono);
    font-size: 12px;
    text-align: right;
  }
  .a-row .pc::after {
    content: "%";
    color: var(--faint);
  }
  .a-prog {
    height: 2px;
    background: var(--rule);
    margin: 9px 0 0 32px;
    position: relative;
    border-radius: 2px;
  }
  .a-prog i {
    position: absolute;
    left: 0;
    top: 0;
    height: 2px;
    width: var(--w, 0%);
    background: var(--dc);
    border-radius: 2px;
    transition: width 1.4s var(--ease);
  }
  .rits {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 10px 0 0 32px;
  }
  .rit {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    height: 27px;
    padding: 0 11px 0 8px;
    border-radius: 99px;
    border: 1px solid var(--rule2);
    font-size: 12px;
    color: var(--mute);
    transition: all 0.4s var(--spring);
    background: transparent;
  }
  .rit i {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    border: 1px solid currentColor;
    transition: all 0.35s var(--ease);
    position: relative;
    overflow: hidden;
    flex: none;
  }
  .rit i::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: var(--p, 0%);
    background: var(--dc);
    transition: height 1s var(--ease);
  }
  .rit:hover {
    border-color: var(--dc);
    color: var(--ink);
    transform: translateY(-2px);
  }
  .rit[aria-pressed="true"] {
    color: var(--ink);
    border-color: var(--dc);
    background: color-mix(in srgb, var(--dc) 16%, transparent);
  }
  .rit[aria-pressed="true"] i {
    background: var(--dc);
    border-color: var(--dc);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--dc) 24%, transparent);
  }
  .led-foot {
    display: flex;
    gap: 8px;
    padding: 12px 0 16px;
    border-top: 1px solid var(--rule);
    flex-wrap: wrap;
  }
  .btn {
    height: 34px;
    padding: 0 16px;
    border-radius: 99px;
    background: var(--ink);
    color: var(--bg);
    font-size: 12.5px;
    font-weight: 500;
    transition: transform 0.4s var(--spring);
  }
  .btn:hover {
    transform: translateY(-2px);
  }
  .btn:active {
    transform: scale(0.95);
  }
  .btn.ghost {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--rule2);
  }
  .btn.ghost:hover {
    border-color: var(--ink);
  }
  .btn.danger {
    background: transparent;
    color: var(--bad);
    border: 1px solid color-mix(in srgb, var(--bad) 45%, transparent);
  }
  .lnk {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--mute);
    transition: color 0.3s;
  }
  .lnk:hover {
    color: var(--ink);
  }

  /* drawer */
  .drawer {
    position: absolute;
    z-index: 40;
    top: 0;
    right: 0;
    bottom: 0;
    width: min(580px, 100%);
    background: var(--bg);
    border-left: 1px solid var(--rule2);
    display: flex;
    flex-direction: column;
    transform: translateX(104%);
    transition:
      transform 1s var(--ease),
      visibility 0s 1s;
    visibility: hidden;
    box-shadow: -40px 0 80px -40px var(--shadow);
  }
  .app.open .drawer {
    transform: none;
    visibility: visible;
    transition:
      transform 1s var(--ease),
      visibility 0s;
  }
  .app.open .ledger {
    opacity: 0;
    transform: translateX(40px) scale(0.98);
    pointer-events: none;
  }
  .drawer::before {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    height: 5px;
    background: linear-gradient(90deg, var(--dc), color-mix(in srgb, var(--dc) 30%, transparent));
  }
  .dr-head {
    padding: calc(24px + env(safe-area-inset-top, 0px)) 32px 0;
    position: relative;
  }
  .dr-head .close {
    z-index: 3;
    background: var(--card);
    position: absolute;
    right: 24px;
    top: calc(24px + env(safe-area-inset-top, 0px));
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid var(--rule2);
    display: grid;
    place-items: center;
    transition:
      transform 0.6s var(--spring),
      border-color 0.3s;
  }
  .dr-head .close:hover {
    transform: rotate(90deg);
    border-color: var(--ink);
  }
  .dr-head .close svg {
    width: 14px;
    height: 14px;
    stroke: currentColor;
    stroke-width: 1.6;
    fill: none;
    stroke-linecap: round;
  }
  .dr-head h1 {
    margin: 12px 0 0;
    padding-right: 48px;
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(42px, 6.4vw, 66px);
    line-height: 0.92;
    letter-spacing: -0.03em;
    overflow-wrap: anywhere;
    text-wrap: balance;
  }
  .dr-head h1 em {
    color: color-mix(in srgb, var(--dc) 75%, var(--ink));
    font-style: italic;
  }
  .dr-head .note {
    font-family: var(--serif);
    font-style: italic;
    font-size: 18px;
    color: var(--mute);
    margin: 12px 0 0;
    line-height: 1.35;
    max-width: 48ch;
  }
  .app.open .dr-head > * {
    animation: rise 0.9s var(--ease) backwards;
  }
  .app.open .dr-head h1 {
    animation-delay: 0.12s;
  }
  .app.open .dr-head .note {
    animation-delay: 0.2s;
  }
  .dr-stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    margin: 20px 0 0;
    border-top: 1px solid var(--rule2);
    border-bottom: 1px solid var(--rule);
  }
  .dr-stats div {
    padding: 12px 0;
    border-right: 1px solid var(--rule);
    min-width: 0;
  }
  .dr-stats div + div {
    padding-left: 14px;
  }
  .dr-stats div:last-child {
    border-right: 0;
  }
  .dr-stats b {
    display: block;
    font-family: var(--serif);
    font-size: 30px;
    font-weight: 400;
    line-height: 1;
  }
  .dr-stats small {
    font-size: 16px;
    color: var(--mute);
  }
  .dr-stats span {
    font-family: var(--mono);
    font-size: 9.5px;
    color: var(--mute);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .dr-bar {
    height: 3px;
    background: var(--rule);
    position: relative;
    margin-top: -1px;
  }
  .dr-bar i {
    position: absolute;
    inset: 0 auto 0 0;
    width: var(--w, 0%);
    background: var(--dc);
    transition: width 1.1s var(--ease);
  }
  .dr-tabs {
    display: flex;
    gap: 22px;
    padding: 0 32px;
    margin-top: 6px;
    border-bottom: 1px solid var(--rule);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .dr-tabs button {
    position: relative;
    padding: 12px 0;
    font-size: 13.5px;
    color: var(--mute);
    white-space: nowrap;
    transition: color 0.3s;
  }
  .dr-tabs button::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: -1px;
    height: 2px;
    background: var(--dc);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.5s var(--ease);
  }
  .dr-tabs button[aria-selected="true"] {
    color: var(--ink);
  }
  .dr-tabs button[aria-selected="true"]::after {
    transform: scaleX(1);
  }
  .dr-body {
    flex: 1;
    overflow: auto;
    padding: 22px 32px 48px;
    overscroll-behavior: contain;
    scrollbar-width: thin;
  }
  .grp {
    animation: rise 0.8s var(--ease) backwards;
    animation-delay: calc(var(--i, 0) * 80ms);
  }
  .grp + .grp {
    margin-top: 26px;
  }
  .grp-h {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    border-bottom: 1px solid var(--rule2);
    padding-bottom: 8px;
  }
  .grp-h h3 {
    margin: 0;
    font-family: var(--serif);
    font-weight: 400;
    font-size: 26px;
    letter-spacing: -0.01em;
  }
  .ck {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .ck li {
    border-bottom: 1px solid var(--rule);
    animation: rise 0.6s var(--ease) backwards;
    animation-delay: calc(var(--j, 0) * 28ms + 120ms);
  }
  .ci {
    display: grid;
    grid-template-columns: 20px minmax(0, 1fr);
    gap: 14px;
    align-items: start;
    padding: 12px 0;
    cursor: pointer;
    font-size: 14px;
    line-height: 1.45;
    transition: transform 0.4s var(--ease);
  }
  .ci:hover {
    transform: translateX(4px);
  }
  .ci span {
    transition: color 0.3s;
  }
  .check {
    appearance: none;
    -webkit-appearance: none;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 1.5px solid var(--rule2);
    display: grid;
    place-items: center;
    cursor: pointer;
    margin: 1px 0 0;
    transition: all 0.4s var(--spring);
    flex: none;
    background: var(--card);
  }
  .check:hover {
    border-color: var(--dc);
    transform: scale(1.12);
  }
  .check:checked {
    background: var(--dc);
    border-color: var(--dc);
    animation: tick 0.5s var(--spring);
  }
  .check:checked::after {
    content: "";
    width: 5px;
    height: 9px;
    border: solid #fff;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg) translate(-1px, -1px);
  }
  .ci:has(.check:checked) span {
    color: var(--faint);
    text-decoration: line-through;
    text-decoration-thickness: 1px;
  }
  .prose {
    font-size: 14px;
    color: var(--mute);
    line-height: 1.65;
    margin: 6px 0 14px;
    max-width: 56ch;
  }
  .deliver {
    font-family: var(--serif);
    font-size: 26px;
    line-height: 1.18;
    margin: 8px 0 6px;
    letter-spacing: -0.01em;
    text-wrap: pretty;
  }
  .field {
    width: 100%;
    border: 0;
    border-bottom: 1.5px solid var(--rule2);
    background: transparent;
    padding: 8px 2px;
    border-radius: 0;
    font-family: var(--serif);
    font-size: 19px;
    line-height: 1.5;
    resize: vertical;
    min-height: 90px;
    transition: border-color 0.3s;
  }
  .field:focus {
    outline: none;
    border-color: var(--dc, var(--acc));
  }
  .field::placeholder {
    color: var(--faint);
  }
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 8px 0 0;
  }

  /* views */
  .view {
    position: absolute;
    z-index: 8;
    left: var(--gx);
    right: calc(var(--gxr) + 372px);
    top: calc(70px + env(safe-area-inset-top, 0px));
    bottom: 0;
    overflow: auto;
    padding: 20px 12px calc(60px + env(safe-area-inset-bottom, 0px)) 0;
    scrollbar-width: thin;
  }
  .view[hidden] {
    display: none;
  }
  .view.vin {
    animation: viewIn 0.9s var(--ease) backwards;
  }
  .view h2 {
    margin: 8px 0 0;
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(40px, 5vw, 64px);
    line-height: 0.95;
    letter-spacing: -0.03em;
    text-wrap: balance;
  }
  .blk {
    display: grid;
    grid-template-columns: 140px minmax(0, 1fr);
    gap: 22px;
    padding: 24px 0;
    border-bottom: 1px solid var(--rule);
    animation: rise 0.9s var(--ease) backwards;
    animation-delay: calc(var(--i) * 90ms + 150ms);
  }
  .blk .when {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--mute);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding-top: 8px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .blk .dot {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: conic-gradient(var(--acc) calc(var(--bp) * 1%), var(--rule2) 0);
    display: grid;
    place-items: center;
    transition: background 0.6s;
  }
  .blk .dot::after {
    content: "";
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--bg);
  }
  .blk h3 {
    margin: 0;
    font-family: var(--serif);
    font-weight: 400;
    font-size: 32px;
    line-height: 1.02;
    letter-spacing: -0.01em;
  }
  .blk .out {
    font-size: 13.5px;
    color: var(--mute);
    line-height: 1.6;
    margin: 10px 0 0;
    max-width: 60ch;
  }
  .sec-h {
    font-family: var(--serif);
    font-size: 34px;
    font-weight: 400;
    margin: 40px 0 4px;
    letter-spacing: -0.01em;
  }
  .grid2 {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 0 28px;
  }
  .trk {
    padding: 14px 0;
    border-bottom: 1px solid var(--rule);
  }
  .trk h4 {
    margin: 0 0 6px;
    font-family: var(--serif);
    font-weight: 400;
    font-size: 22px;
  }
  .trk p {
    margin: 0;
    font-size: 13px;
    color: var(--mute);
    line-height: 1.55;
  }
  .rt {
    display: grid;
    grid-template-columns: 62px minmax(0, 1fr);
    gap: 16px;
    padding: 14px 0;
    border-bottom: 1px solid var(--rule);
    align-items: baseline;
  }
  .rt b {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 36px;
    line-height: 1;
  }
  .rt b small {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--mute);
    margin-left: 2px;
  }
  .rt h4 {
    margin: 0;
    font-family: var(--serif);
    font-weight: 400;
    font-size: 21px;
  }
  .rt p {
    margin: 3px 0 0;
    font-size: 13px;
    color: var(--mute);
    line-height: 1.5;
  }
  .proj {
    display: grid;
    grid-template-columns: 20px minmax(0, 1fr);
    gap: 16px;
    padding: 22px 0;
    border-bottom: 1px solid var(--rule);
    animation: rise 0.8s var(--ease) backwards;
    animation-delay: calc(var(--i) * 55ms + 120ms);
  }
  .proj .check {
    margin-top: 8px;
  }
  .proj h3 {
    margin: 0;
    font-family: var(--serif);
    font-weight: 400;
    font-size: 28px;
    line-height: 1.05;
    letter-spacing: -0.01em;
    transition: color 0.4s;
  }
  .proj .tag {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--mute);
    margin-right: 10px;
  }
  .proj.done h3 {
    color: var(--faint);
    text-decoration: line-through;
    text-decoration-thickness: 1px;
  }
  .proj ol {
    margin: 10px 0 0;
    padding-left: 18px;
    font-size: 13.5px;
    color: var(--mute);
    line-height: 1.65;
  }
  .proj .prv {
    margin: 10px 0 0;
    font-family: var(--serif);
    font-style: italic;
    font-size: 18px;
    color: var(--ink);
  }

  .veil {
    position: absolute;
    inset: 0;
    z-index: 60;
    background: color-mix(in srgb, var(--bg) 55%, transparent);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px var(--gxr) 20px var(--gx);
    animation: fade 0.4s both;
  }
  .veil[hidden] {
    display: none;
  }
  .modal {
    width: min(440px, 100%);
    background: var(--card);
    border: 1px solid var(--rule2);
    border-radius: 22px;
    padding: 28px;
    animation: rise 0.8s var(--spring) both;
    box-shadow: 0 40px 80px -30px var(--shadow);
  }
  .modal h3 {
    margin: 0 0 8px;
    font-family: var(--serif);
    font-weight: 400;
    font-size: 34px;
    line-height: 1;
  }
  .modal p {
    margin: 0;
    color: var(--mute);
    font-size: 13.5px;
    line-height: 1.6;
  }
  .modal .acts {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    margin-top: 22px;
    flex-wrap: wrap;
  }
  .toast {
    position: absolute;
    z-index: 80;
    left: 50%;
    bottom: calc(26px + env(safe-area-inset-bottom, 0px));
    transform: translate(-50%, 24px) scale(0.96);
    opacity: 0;
    padding: 11px 20px;
    border-radius: 99px;
    background: var(--ink);
    color: var(--bg);
    font-size: 13px;
    transition: 0.7s var(--spring);
    pointer-events: none;
    max-width: calc(100% - 32px);
    text-align: center;
    box-shadow: 0 18px 40px -16px var(--shadow);
  }
  .toast.on {
    opacity: 1;
    transform: translate(-50%, 0) scale(1);
  }

  .app[data-view="map"] .view {
    display: none;
  }
  .app:not([data-view="map"]) .map,
  .app:not([data-view="map"]) .tools {
    opacity: 0;
    pointer-events: none;
  }

  @keyframes blink {
    50% {
      opacity: 0.25;
    }
  }
  @keyframes rise {
    from {
      opacity: 0;
      transform: translateY(16px);
    }
  }
  @keyframes fade {
    from {
      opacity: 0;
    }
  }
  @keyframes pop {
    from {
      opacity: 0;
      transform: scale(0.4);
    }
  }
  @keyframes slideIn {
    from {
      opacity: 0;
      transform: translateX(40px);
    }
  }
  @keyframes viewIn {
    from {
      opacity: 0;
      transform: translateY(24px);
      filter: blur(8px);
    }
  }
  @keyframes letter {
    from {
      opacity: 0;
      transform: translateY(60%) rotate(6deg);
      filter: blur(6px);
    }
  }
  @keyframes flow {
    to {
      stroke-dashoffset: -22;
    }
  }
  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }
  @keyframes bob {
    0% {
      transform: translate(0, 0);
    }
    35% {
      transform: translate(3px, -7px);
    }
    70% {
      transform: translate(-3px, -2px);
    }
    100% {
      transform: translate(2px, 5px);
    }
  }
  @keyframes pulseHalo {
    0% {
      opacity: 0.4;
      transform: scale(0.9);
    }
    100% {
      opacity: 0;
      transform: scale(1.8);
    }
  }
  @keyframes breathe {
    0% {
      opacity: 0.7;
      transform: scale(1);
    }
    100% {
      opacity: 0;
      transform: scale(1.9);
    }
  }
  @keyframes rip {
    from {
      opacity: 0.9;
      transform: scale(1);
    }
    to {
      opacity: 0;
      transform: scale(2.8);
    }
  }
  @keyframes tick {
    0% {
      transform: scale(0.7);

  @media (prefers-reduced-motion: reduce) {
    * {
      animation-duration: 0.01ms !important;
      animation-delay: 0s !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }

  /* ===================== v3: currents, palette, atelier, ripples ===================== */
  @keyframes clipUp {
    from {
      clip-path: inset(0 0 100% 0);
      transform: translateY(55%);
    }
    to {
      clip-path: inset(-12% 0 -30% 0);
      transform: none;
    }
  }
  @keyframes rp {
    to {
      transform: scale(1);
      opacity: 0;
    }
  }
  @keyframes cellIn {
    from {
      opacity: 0;
      transform: scale(0.2);
    }
  }
  @keyframes palIn {
    from {
      opacity: 0;
      transform: translateY(-14px) scale(0.97);
    }
  }
  @keyframes dashRun {
    to {
      stroke-dashoffset: -12;
    }
  }
  .view h2,
  .app.open .dr-head h1 {
    animation: clipUp 1.15s var(--ease) 0.12s backwards;
  }
  .btn,
  .ibtn,
  .rit,
  .fbtn,
  .zoom button,
  .modes button,
  .seg button,
  .cbtn,
  .pal-i,
  .sw button,
  .step button {
    position: relative;
    overflow: hidden;
  }
  .rp {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    background: currentColor;
    transform: scale(0);
    opacity: 0.26;
    animation: rp 0.7s cubic-bezier(0.2, 0.7, 0.3, 1) forwards;
    z-index: 0;
  }
  html[data-motion="calm"] .node .fl {
    animation-duration: calc(var(--bd, 7s) * 2.4);
  }
  html[data-motion="calm"] .edge,
  html[data-motion="calm"] .orbit {
    animation-duration: 6s;
  }
  html[data-motion="off"] *,
  html[data-motion="off"] *::before,
  html[data-motion="off"] *::after {
    animation-duration: 0.01ms !important;
    animation-delay: 0s !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }

  /* segmented control + chart buttons */
  .seg {
    display: inline-flex;
    padding: 3px;
    gap: 2px;
    border: 1px solid var(--rule2);
    border-radius: 99px;

  .seg button {
    height: 28px;
    padding: 0 13px;

    font-family: var(--mono);
    font-size: 10.5px;

    color: var(--mute);

      background 0.4s var(--ease),
      color 0.3s,
      transform 0.3s var(--spring);
  }
  .seg button:hover {
    color: var(--ink);
  }
  .seg button:active {
    transform: scale(0.92);
  }
  .seg button[aria-pressed="true"] {
    background: var(--ink);
    color: var(--bg);
  }
  .cbtn {
    height: 34px;
    padding: 0 15px 0 12px;
    border-radius: 99px;
    border: 1px solid var(--rule2);
    background: var(--glass);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    isolation: isolate;
    transition:
      border-color 0.3s,
      color 0.3s,
      transform 0.35s var(--spring),
      box-shadow 0.4s;
  }
  .cbtn:hover {
    border-color: var(--ink);
  }
  .cbtn:active {
    transform: scale(0.94);
  }
  .cbtn svg {
    width: 13px;
    height: 13px;
    flex: none;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .cbtn .prog {
    position: absolute;
    inset: 0;
    z-index: -1;
    background: var(--acc);
    transform-origin: left;
    transform: scaleX(var(--p, 0));
    opacity: 0;
    transition: opacity 0.3s;
  }
  .cbtn.on {
    color: #fff;
    border-color: var(--acc);
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--acc) 22%, transparent);
    background: color-mix(in srgb, var(--acc) 55%, var(--bg));
  }
  .cbtn.on .prog {
    opacity: 1;
  }
  .cbtn .dotf {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: currentColor;
    opacity: 0.35;
    transition:
      opacity 0.3s,
      transform 0.4s var(--spring),
      box-shadow 0.3s;
  }
  .cbtn.fc.on {
    background: var(--glass);
    color: var(--acc);
    border-color: var(--acc);
    box-shadow: none;
  }
  .cbtn.fc.on .dotf {
    opacity: 1;
    transform: scale(1.3);
    box-shadow: 0 0 10px var(--acc);
  }

  /* currents view */
  .cur-stats {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    margin: 22px 0 0;
    border-top: 1px solid var(--rule2);
    border-bottom: 1px solid var(--rule);
  }
  .cur-stats > div {
    padding: 14px 0 14px 16px;
    border-right: 1px solid var(--rule);
    min-width: 0;
    animation: rise 0.9s var(--ease) backwards;
  }
  .cur-stats > div:first-child {
    padding-left: 0;
  }
  .cur-stats > div:last-child {
    border-right: 0;
  }
  .cur-stats > div:nth-child(2) {
    animation-delay: 0.08s;
  }
  .cur-stats > div:nth-child(3) {
    animation-delay: 0.16s;
  }
  .cur-stats > div:nth-child(4) {
    animation-delay: 0.24s;
  }
  .cur-stats b {
    display: block;
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(26px, 3.2vw, 40px);
    line-height: 1;
    letter-spacing: -0.02em;
  }
  .cur-stats b small {
    font-size: 0.45em;
    color: var(--mute);
    font-style: italic;
    margin-left: 4px;
    letter-spacing: 0;
  }
  .cur-stats span {
    display: block;
    margin-top: 6px;
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--mute);
  }
  .cur-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin-top: 18px;
  }
  .cur-bar .sp {
    flex: 1;
  }
  .cur-wrap {
    position: relative;
    height: clamp(300px, 46vh, 470px);
    margin-top: 12px;
    border: 1px solid var(--rule);
    border-radius: 20px;
    background: color-mix(in srgb, var(--card) 55%, transparent);
    overflow: hidden;
  }
  .cur-wrap canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: pan-y;
    cursor: crosshair;
  }
  .cur-badge {
    position: absolute;
    left: 14px;
    top: 12px;
    padding: 5px 11px;
    border-radius: 99px;
    border: 1px dashed var(--acc);
    color: var(--acc);
    background: var(--glass);
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    animation: rise 0.8s var(--ease) both;
    pointer-events: none;
  }
  .cur-tip {
    position: absolute;
    left: 0;
    top: 0;
    z-index: 5;
    width: 218px;
    padding: 11px 13px 10px;
    border-radius: 14px;
    border: 1px solid var(--rule2);
    background: var(--glass);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 20px 44px -20px var(--shadow);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
    will-change: transform;
  }
  .cur-tip.on {
    opacity: 1;
  }
  .cur-tip .d {
    font-family: var(--serif);
    font-style: italic;
    font-size: 20px;
    line-height: 1.05;
  }
  .cur-tip .d small {
    font-family: var(--mono);
    font-style: normal;
    font-size: 9.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--acc);
    margin-left: 6px;
  }
  .cur-tip .r {
    display: grid;
    grid-template-columns: 8px minmax(0, 1fr) auto;
    gap: 8px;
    align-items: center;
    font-size: 12px;
    color: var(--mute);
    padding: 2px 0;
  }
  .cur-tip .r i {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--dc);
  }
  .cur-tip .r span {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .cur-tip .r b {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 500;
    color: var(--ink);
  }
  .cur-tip .rows {
    margin-top: 7px;

    border-top: 1px solid var(--rule);
  }
  .heat-wrap {
    overflow-x: auto;
    padding-bottom: 6px;
    scrollbar-width: thin;
  }
  .heat-m {
    display: grid;
    grid-template-columns: repeat(26, 15px);
    gap: 4px;
    margin-bottom: 6px;
    font-family: var(--mono);
    font-size: 9.5px;
    color: var(--faint);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .heat {
    display: grid;
    grid-template-rows: repeat(7, 15px);
    grid-auto-flow: column;
    grid-auto-columns: 15px;
    gap: 4px;
  }
  .heat i {
    border-radius: 4px;
    background: color-mix(in srgb, var(--acc) calc(var(--a) * 100%), var(--rule));
    transition:
      transform 0.3s var(--spring),
      outline-color 0.3s;
    outline: 2px solid transparent;
  }
  .heat.in i {
    animation: cellIn 0.7s var(--spring) backwards;
    animation-delay: var(--d);
  }
  .heat i:hover {
    transform: scale(1.35);
    outline-color: var(--ink);
    z-index: 1;
    position: relative;
  }
  .heat i.fut {
    background: transparent;
    outline: 1px dashed var(--rule);
  }
  .heat-leg {
    display: flex;
    align-items: center;
    gap: 5px;
    margin-top: 8px;
    font-family: var(--mono);
    font-size: 9.5px;
    color: var(--mute);
    letter-spacing: 0.06em;
  }
  .heat-leg i {
    width: 12px;
    height: 12px;
    border-radius: 3px;
    background: color-mix(in srgb, var(--acc) calc(var(--a) * 100%), var(--rule));
  }

  /* command palette */
  .pal {
    position: absolute;
    inset: 0;
    z-index: 70;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 12vh var(--gxr) 20px var(--gx);
    background: color-mix(in srgb, var(--bg) 52%, transparent);
    backdrop-filter: blur(9px);
    -webkit-backdrop-filter: blur(9px);
    animation: fade 0.3s both;
  }
  .pal[hidden] {
    display: none;
  }
  .pal-box {
    width: min(560px, 100%);
    border: 1px solid var(--rule2);
    border-radius: 20px;
    background: var(--card);
    box-shadow: 0 50px 90px -34px var(--shadow);
    overflow: hidden;
    animation: palIn 0.55s var(--spring) both;
  }
  .pal-box input {
    width: 100%;
    border: 0;
    outline: none;
    background: transparent;
    padding: 20px 22px 16px;
    font-family: var(--serif);
    font-size: 26px;
    border-bottom: 1px solid var(--rule);
  }
  .pal-box input::placeholder {
    color: var(--faint);
    font-style: italic;
  }
  .pal-box ul {
    list-style: none;
    margin: 0;
    padding: 8px;
    max-height: min(52vh, 420px);
    overflow: auto;
    scrollbar-width: thin;
  }
  .pal-i {
    display: grid;
    grid-template-columns: 10px minmax(0, 1fr) auto;
    align-items: center;
    gap: 12px;
    padding: 11px 14px;
    border-radius: 12px;
    cursor: pointer;
    animation: rise 0.45s var(--ease) backwards;
    animation-delay: calc(var(--j) * 22ms);
    transition:
      background 0.25s,
      transform 0.3s var(--ease);
  }
  .pal-i i {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--dc, var(--faint));
  }
  .pal-i b {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 20px;
    line-height: 1.1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .pal-i span {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.06em;
    color: var(--mute);
    white-space: nowrap;
  }
  .pal-i.sel {
    background: color-mix(in srgb, var(--ink) 7%, transparent);
    transform: translateX(4px);
  }
  .pal-foot {
    display: flex;
    gap: 14px;
    padding: 10px 22px 14px;
    border-top: 1px solid var(--rule);
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.06em;
    color: var(--mute);
  }
  .pal-empty {
    padding: 22px 14px;
    font-family: var(--serif);
    font-style: italic;
    font-size: 20px;
    color: var(--mute);
  }

  /* atelier */
  .atl {
    width: min(480px, 100%);
    max-height: 100%;
    overflow: auto;
  }
  .atl-r {
    margin-top: 20px;
    display: grid;
    gap: 9px;
  }
  .sw {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .sw button {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--c);
    border: 2px solid var(--card);
    outline: 1.5px solid var(--rule2);
    transition:
      transform 0.4s var(--spring),
      outline-color 0.3s;

  .sw button.auto {

  }
  .sw button:hover {
    transform: scale(1.14);
  }
  .sw button[aria-pressed="true"] {
    outline: 2px solid var(--ink);
    transform: scale(1.12);
  }
  .step {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .step button {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid var(--rule2);
    font-size: 18px;
    line-height: 1;
    transition:
      transform 0.3s var(--spring),
      border-color 0.3s;
  }
  .step button:hover {
    border-color: var(--ink);
  }
  .step b {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 38px;
    line-height: 1;
    min-width: 2ch;
    text-align: center;
  }
  .step span {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--mute);
  }
  .dt {
    border: 0;
    border-bottom: 1.5px solid var(--rule2);
    background: transparent;
    font-family: var(--serif);
    font-size: 22px;
    padding: 6px 2px;
    width: 100%;
    color-scheme: inherit;
  }
  .dt:focus {
    outline: none;
    border-color: var(--acc);
  }
  .atl textarea {
    min-height: 110px;
    font-size: 13px;
    font-family: var(--mono);
  }
  @media (max-width: 860px) {
    .cur-stats {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .cur-stats > div:nth-child(2) {
      border-right: 0;
    }
    .cur-stats > div:nth-child(3) {
      padding-left: 0;
      border-top: 1px solid var(--rule);
    }
    .cur-stats > div:nth-child(4) {
      border-top: 1px solid var(--rule);
    }
    .cur-wrap {
      height: 320px;
    }
    .pal {
      padding-top: 8vh;
    }
  }

  /* ===================== v4: phone-first layout + stronger motion ===================== */
  html {
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    -webkit-touch-callout: none;
    overscroll-behavior: none;
  }
  .map,
  .node {
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  #fx2 {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    display: block;
    z-index: 89;
  }
  @keyframes shine {
    to {
      background-position: -160% 0;
    }
  }
  @keyframes drawStroke {
    from {
      stroke-dashoffset: 70;
    }
    to {
      stroke-dashoffset: 0;
    }
  }
  @keyframes sheetUp {
    from {
      opacity: 0;
      transform: translateY(60px);
    }
  }
  @keyframes grabHint {
    0%,
    100% {
      transform: translateY(0);
    }
    35% {
      transform: translateY(-5px);
    }
    65% {
      transform: translateY(1px);
    }
  }
  @keyframes tabPop {
    0% {
      transform: scale(0.8);
    }
    60% {
      transform: scale(1.16);
    }
    100% {
      transform: scale(1.12);
    }
  }

  /* hero number shimmer */
  .big #pct {
    background: linear-gradient(100deg, var(--ink) 34%, var(--acc) 50%, var(--ink) 66%);
    background-size: 260% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    animation: shine 7s linear infinite;
  }

  /* map extras: aurora, packets, crowns */
  .aura {
    animation-duration: 38s;
    pointer-events: none;
  }
  .pk circle:first-child {
    opacity: 0.2;
  }
  .map[data-f="1"] .pk,

      }
      function end() {
        if (!act) return;
        act = false;
        dr.style.transition = "";
        dr.style.transform = "";
        $("#scrim").style.opacity = "";
        if (dy > 110 || vy > 0.7) {
          closeDrawer();
          haptic();
        }
      }
      [$("#drGrab"), $(".dr-head")].forEach(function (h) {
        h.addEventListener("pointerdown", start);
        h.addEventListener("pointermove", move);
        h.addEventListener("pointerup", end);
        h.addEventListener("pointercancel", end);
      });
    })();

    /* ---------- double-tap to zoom the map ---------- */
    var lastTap = { t: 0, x: 0, y: 0 };
    function dblTap(e) {
      if (moved || (e.target.closest && e.target.closest(".node"))) return;
      var n = performance.now();
      if (n - lastTap.t < 300 && Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 28) {
        zoomAt(e.clientX, e.clientY, tg.k < 1 ? 1.9 : 0.5, false);
        lastTap.t = 0;
        haptic();
      } else lastTap = { t: n, x: e.clientX, y: e.clientY };
    }

    /* ---------- starfield with constellations, parallaxed by pan and tilt ---------- */
    var STARS = [];
    (function () {
      var n = IS_M.matches ? 46 : 84;
      for (var i = 0; i < n; i++) {
        STARS.push({
          x: hsh(i * 17 + 3),
          y: hsh(i * 53 + 11),
          z: 0.25 + hsh(i * 97 + 5) * 0.9,
          s: 0.7 + hsh(i * 13 + 1) * 1.6,
          p: hsh(i * 29 + 9) * 6.28,
          c: Math.floor(hsh(i * 41 + 2) * 7),
        });
      }
    })();
    function drawStars(t, w, h) {
      var ox = cam.x * 0.06 + px * 18,
        oy = cam.y * 0.06 + py * 18,
        pts = [],
        i,
        j;
      for (i = 0; i < STARS.length; i++) {
        var s = STARS[i],
          x = (((s.x * w + ox * s.z) % w) + w) % w,
          y = (((s.y * h + oy * s.z) % h) + h) % h,
          tw = 0.55 + 0.45 * Math.sin(t * 1.3 + s.p),
          a = (DARK ? 0.8 : 0.6) * tw * s.z;
        bctx.beginPath();
        bctx.arc(x, y, s.s * s.z, 0, 6.283);
        bctx.fillStyle = rgba(PAL[s.c], a);
        bctx.fill();
        if (i < 34) pts.push([x, y, s.c]);
      }
      bctx.lineWidth = 1;
      for (i = 0; i < pts.length; i++) {
        for (j = i + 1; j < pts.length; j++) {
          var d = Math.hypot(pts[i][0] - pts[j][0], pts[i][1] - pts[j][1]);
          if (d < 130) {
            bctx.strokeStyle = rgba(PAL[pts[i][2]], (DARK ? 0.22 : 0.18) * (1 - d / 130));
            bctx.beginPath();
            bctx.moveTo(pts[i][0], pts[i][1]);
            bctx.lineTo(pts[j][0], pts[j][1]);
            bctx.stroke();
          }
        }
      }
    }

    /* ---------- shockwaves and drag trail on their own canvas ---------- */
    var fx2c = $("#fx2"),
      f2 = fx2c.getContext && fx2c.getContext("2d"),
      waves = [],
      trl = [],
      lastTrail = 0,
      fx2d = false;
    function shock(x, y, rgb, big) {
      if (reduced || !f2) return;
      waves.push({ x: x, y: y, r: 6, l: 1, c: rgb, m: big ? 190 : 96 });
    }
    function trail(x, y) {
      if (reduced || !f2) return;
      var n = performance.now();
      if (n - lastTrail < 20) return;
      lastTrail = n;
      trl.push({
        x: x + (Math.random() - 0.5) * 8,
        y: y + (Math.random() - 0.5) * 8,
        l: 1,
        c: PAL[Math.floor((x + y) / 110) % 7] || PAL[0],
        z: 2.5 + Math.random() * 2.8,
      });
      if (trl.length > 64) trl.shift();
    }
    function drawFx2() {
      if (!f2) return;
      if (!waves.length && !trl.length) {
        if (fx2d) {
          f2.clearRect(0, 0, CW, CH);
          fx2d = false;
        }
        return;
      }
      fx2d = true;
      f2.clearRect(0, 0, CW, CH);
      waves = waves.filter(function (w) {
        w.r += (w.m - w.r) * 0.075;
        w.l -= 0.024;
        if (w.l <= 0) return false;
        f2.beginPath();
        f2.arc(w.x, w.y, w.r, 0, 6.283);
        f2.lineWidth = 2.6 * w.l + 0.4;
        f2.strokeStyle = rgba(w.c, w.l * 0.75);
        f2.stroke();
        return true;
      });
      trl = trl.filter(function (p) {
        p.l -= 0.05;
        if (p.l <= 0) return false;
        f2.beginPath();
        f2.arc(p.x, p.y, p.z * p.l, 0, 6.283);
        f2.fillStyle = rgba(p.c, p.l * 0.6);
        f2.fill();
        return true;
      });
    }

    /* ---------- tilt parallax (opt-in, needs motion permission on iPhone) ---------- */
    var tiltOn = false,
      tiltAsked = false;
    function tiltHandler(e) {
      if (e.gamma == null) return;
      pxT = Math.max(-1, Math.min(1, e.gamma / 28));
      pyT = Math.max(-1, Math.min(1, (e.beta - 50) / 28));
    }
    function setTilt(on) {
      if (on === tiltOn) return;
      tiltOn = on;
      if (on) window.addEventListener("deviceorientation", tiltHandler);
      else window.removeEventListener("deviceorientation", tiltHandler);
    }
    function askTilt(cb) {
      var D = window.DeviceOrientationEvent;
      if (D && typeof D.requestPermission === "function") {
        D.requestPermission()
          .then(function (r) {
            cb(r === "granted");
          })
          .catch(function () {
            cb(false);
          });
      } else cb(!!D);
    }
    function tiltArm() {
      var on = !!S.cfg.tilt;
      setTilt(on);
      var D = window.DeviceOrientationEvent;
      if (on && D && typeof D.requestPermission === "function" && !tiltAsked) {
        tiltAsked = true;
        document.addEventListener(
          "click",
          function once() {
            document.removeEventListener("click", once, true);
            askTilt(function (ok) {
              if (!ok) setTilt(false);
            });
          },
          true
        );
      }
    }

    /* ---------- splash ---------- */
    (function () {
      var sp = $("#splash");
      if (!sp) return;
      if (reduced) {
        sp.remove();
        return;
      }
      setTimeout(function () {
        sp.classList.add("out");
        setTimeout(function () {
          if (sp.parentNode) sp.parentNode.removeChild(sp);
        }, 1000);
      }, 1050);
    })();

    /* ---------- boot ---------- */
    function updateAll(soft) {
      bgDirty = true;
      updateMap();
      updateLedger();
      if (CUR.mounted) refreshCur();
      if ($("#app").dataset.view !== "map" && soft !== true) renderView();
    }
    $("#brandB").innerHTML = "Finance 69"
      .split("")
      .map(function (c, i) {
        return '<span style="--i:' + i + '">' + (c === " " ? "&nbsp;" : c) + "</span>";
      })
      .join("");
    readPal();
    sizeCanvases();
    buildMap();
    buildLedger();
    updateAll();
    renderSess();
    var startV = (location.hash || "").slice(1);
    setView(VIEWS.indexOf(startV) > -1 ? startV : "map", true);
    (function intro() {
      var f = fitTarget();
      tg.x = f.x;
      tg.y = f.y;
      tg.k = f.k;
      cam.x = f.x;
      cam.y = f.y + 60;
      cam.k = f.k * (reduced ? 1 : 0.55);
      applyCam();
      setTimeout(mobileFocus, 1250);
    })();
    var rzT = 0;
    window.addEventListener("resize", function () {
      placeInk();
      placeTabInk();
      sizeCanvases();
      sizeCur();
      clearTimeout(rzT);
      rzT = setTimeout(function () {
        if (!openId) fit(false);
      }, 200);
    });
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(function () {
        placeInk();
        placeTabInk();
      });
    }
    applyCfg();
    setSync("local");
    initDb();
    raf = requestAnimationFrame(frame);
  })();
</script>
