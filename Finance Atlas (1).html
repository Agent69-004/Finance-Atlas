<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Finance Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout concept: a bright living map. Seven constellations of subjects float around a hub on a canvas that drifts with color;
   ribbons along the bottom edge are the seven areas as currents and thicken as you progress. The ledger sits right, a subject opens as a folio. */
:root{
  --bg:#F5F6FB; --bg2:#EBEDF6; --card:#FFFFFF; --ink:#12131A; --mute:#5C6177; --faint:#A4A9BE;
  --rule:rgba(18,19,26,.09); --rule2:rgba(18,19,26,.18); --glass:rgba(255,255,255,.74); --halo:#F5F6FB; --shadow:rgba(40,52,120,.22);
  --acc:#FF6B2C; --good:#13A24B; --bad:#E5484D;
  --c1:#FF9F1C; --c2:#12B5A6; --c3:#7B61FF; --c4:#2D7FF9; --c5:#FF5C77; --c6:#22C55E; --c7:#D946EF;
  --serif:"Instrument Serif","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans:"Geist","Helvetica Neue","Segoe UI",system-ui,sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.16,1,.3,1); --spring:cubic-bezier(.34,1.5,.4,1);
  --gx:max(16px,env(safe-area-inset-left,0px)); --gxr:max(16px,env(safe-area-inset-right,0px));
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0B0C12; --bg2:#12141D; --card:#161824; --ink:#ECEEF8; --mute:#9399B0; --faint:#4C5066;
  --rule:rgba(236,238,248,.1); --rule2:rgba(236,238,248,.2); --glass:rgba(16,18,28,.72); --halo:#0B0C12; --shadow:rgba(0,0,0,.55);
  --acc:#FFB020; --good:#4ADE80; --bad:#FF7A90;
  --c1:#FFB020; --c2:#2DD4BF; --c3:#9B87FF; --c4:#4C9AFF; --c5:#FF7A90; --c6:#4ADE80; --c7:#E879F9;
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0B0C12; --bg2:#12141D; --card:#161824; --ink:#ECEEF8; --mute:#9399B0; --faint:#4C5066;
  --rule:rgba(236,238,248,.1); --rule2:rgba(236,238,248,.2); --glass:rgba(16,18,28,.72); --halo:#0B0C12; --shadow:rgba(0,0,0,.55);
  --acc:#FFB020; --good:#4ADE80; --bad:#FF7A90;
  --c1:#FFB020; --c2:#2DD4BF; --c3:#9B87FF; --c4:#4C9AFF; --c5:#FF7A90; --c6:#4ADE80; --c7:#E879F9;
  color-scheme:dark; }
html.tx *,html.tx *::before,html.tx *::after{transition:background-color .6s,color .6s,border-color .6s,fill .6s,stroke .6s!important}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;touch-action:manipulation}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:4px}
::selection{background:var(--acc);color:#fff}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.serif{font-family:var(--serif);font-weight:400}

.app{position:fixed;inset:0;background:var(--bg);color:var(--ink);overflow:hidden}
#bg,#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;display:block}
#bg{z-index:0}
#fx{z-index:90}
.spot{position:absolute;left:0;top:0;width:560px;height:560px;margin:-280px 0 0 -280px;border-radius:50%;pointer-events:none;z-index:1;background:radial-gradient(circle,color-mix(in srgb,var(--acc) 16%,transparent),transparent 62%);opacity:0;transition:opacity .8s;will-change:transform}
.spot.on{opacity:1}
.map{position:absolute;inset:0;z-index:2;width:100%;height:100%;display:block;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;transition:opacity .6s var(--ease)}
.map.drag{cursor:grabbing}
.scrim{position:absolute;inset:0;z-index:35;background:color-mix(in srgb,var(--bg) 38%,transparent);opacity:0;pointer-events:none;transition:opacity .7s var(--ease)}
.app.open .scrim{opacity:1;pointer-events:auto}

/* map elements */
.edge{fill:none;stroke:color-mix(in srgb,var(--ink) 26%,transparent);stroke-width:1.2;stroke-dasharray:3 8;stroke-linecap:round;animation:flow 1.8s linear infinite;transition:stroke .3s}
.edge.hi{stroke:var(--ink);stroke-width:2;stroke-dasharray:none;animation:none}
.spoke{fill:none;stroke:var(--rule2);stroke-width:1;stroke-dasharray:2 7}
.hub-ring{fill:none;stroke:var(--rule2);stroke-width:1}
.hub-core{fill:var(--card);stroke:var(--rule2);stroke-width:1}
.hub-breathe{fill:none;stroke:var(--acc);stroke-width:1.5;transform-box:fill-box;transform-origin:center;animation:breathe 3.6s ease-out infinite}
.orbit{transform-origin:0 0;animation:spin 46s linear infinite}
.orbit.r{animation-direction:reverse;animation-duration:70s}
.hub-t1{font-family:var(--serif);font-style:italic;font-size:26px;fill:var(--ink);text-anchor:middle}
.hub-t2{font-family:var(--mono);font-size:10px;letter-spacing:.14em;fill:var(--mute);text-anchor:middle;text-transform:uppercase}
.cl-name{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;fill:var(--mute);text-anchor:middle}
.cl-pct{font-family:var(--serif);font-size:36px;fill:color-mix(in srgb,var(--dc) 72%,var(--ink));text-anchor:middle}
.node{cursor:pointer;outline:none;transition:opacity .5s}
.node .fl{animation:bob var(--bd,7s) ease-in-out var(--bl,0s) infinite alternate}
.node:hover .fl,.node.sel .fl,.node:focus-visible .fl{animation-play-state:paused}
.node .in{animation:pop 1s var(--spring) backwards;transform-box:fill-box;transform-origin:center;transition:transform .5s var(--spring)}
.node:hover .in,.node:focus-visible .in{transform:scale(1.13)}
.node.sel .in{transform:scale(1.18)}
.node .halo{fill:var(--dc);opacity:0;transition:opacity .35s;transform-box:fill-box;transform-origin:center}
.node:hover .halo,.node:focus-visible .halo,.node.sel .halo{opacity:.2}
.node.next .halo{animation:pulseHalo 2.4s ease-out infinite}
.node .base{fill:var(--card);stroke:var(--rule2);stroke-width:1.5;transition:fill .5s}
.node[data-l="1"] .base{stroke:color-mix(in srgb,var(--ink) 42%,transparent)}
.node[data-l="3"] .base{stroke-dasharray:3 4}
.node.mastered .base{fill:color-mix(in srgb,var(--dc) 22%,var(--card))}
.node .ring{fill:none;stroke:var(--dc);stroke-width:4;stroke-linecap:round;transition:stroke-dasharray 1.2s var(--ease)}
.node .nn{font-family:var(--mono);font-size:13px;font-weight:500;fill:var(--ink);text-anchor:middle}
.node .nl{font-family:var(--serif);font-style:italic;font-size:22px;fill:var(--ink);text-anchor:middle;paint-order:stroke;stroke:var(--halo);stroke-width:5px;stroke-linejoin:round;transition:fill .3s}
.node .nm{font-family:var(--mono);font-size:10.5px;fill:var(--mute);text-anchor:middle;paint-order:stroke;stroke:var(--halo);stroke-width:4px}
.node:hover .nl,.node.sel .nl{fill:color-mix(in srgb,var(--dc) 70%,var(--ink))}
.rip{fill:none;stroke:var(--dc);stroke-width:3;transform-box:fill-box;transform-origin:center;animation:rip 1.2s ease-out forwards}
.map[data-f="1"] .node:not([data-l="1"]),.map[data-f="2"] .node:not([data-l="2"]),.map[data-f="3"] .node:not([data-l="3"]){opacity:.14}

/* tooltip */
.tip{position:absolute;left:0;top:0;z-index:30;pointer-events:none;width:230px;padding:12px 14px;background:var(--glass);border:1px solid var(--rule2);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:14px;box-shadow:0 18px 40px -18px var(--shadow);opacity:0;transition:opacity .25s;will-change:transform}
.tip.on{opacity:1}
.tip .t1{font-family:var(--serif);font-style:italic;font-size:21px;line-height:1.05}
.tip .t2{font-family:var(--mono);font-size:10.5px;color:var(--mute);margin-top:5px;display:flex;justify-content:space-between;gap:10px}
.tip .t2 b{color:var(--ink);font-weight:500}
.tip ul{list-style:none;margin:9px 0 0;padding:9px 0 0;border-top:1px solid var(--rule);font-size:12px;color:var(--mute);line-height:1.4}
.tip li{padding:2px 0}
.tip li::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--dc);margin-right:8px;vertical-align:1px}
.tip .t3{margin-top:8px;font-size:12px;color:var(--good)}

/* top */
.top{position:absolute;z-index:20;top:calc(16px + env(safe-area-inset-top,0px));left:var(--gx);right:var(--gxr);display:flex;align-items:center;gap:16px;pointer-events:none}
.top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:34px;height:34px;flex:none;border-radius:11px;background:var(--ink);display:grid;place-items:center;overflow:hidden}
.logo svg{width:26px;height:26px}
.logo path{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-dasharray:18 6;animation:flow 2.4s linear infinite}
.brand b{font-family:var(--serif);font-size:30px;font-weight:400;letter-spacing:-.01em;line-height:1;white-space:nowrap;display:flex}
.brand b span{display:inline-block;animation:letter 1s var(--ease) backwards;animation-delay:calc(var(--i)*38ms + 150ms)}
.brand em{font-family:var(--mono);font-style:normal;font-size:10.5px;color:var(--mute);letter-spacing:.08em;white-space:nowrap}
.modes{margin:0 auto;display:flex;gap:2px;padding:3px;border:1px solid var(--rule2);border-radius:99px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);position:relative;box-shadow:0 10px 30px -16px var(--shadow)}
.modes button{position:relative;z-index:1;height:30px;padding:0 16px;border-radius:99px;font-size:12.5px;color:var(--mute);transition:color .4s}
.modes button[aria-pressed="true"]{color:var(--bg)}
.modes .ink{position:absolute;top:3px;bottom:3px;left:0;border-radius:99px;background:var(--ink);transition:left .7s var(--spring),width .7s var(--spring)}
.tright{display:flex;align-items:center;gap:10px}
.sync{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10px;color:var(--mute);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.sync[data-s="synced"] i{background:var(--good);box-shadow:0 0 0 4px color-mix(in srgb,var(--good) 20%,transparent)}
.sync[data-s="saving"] i{background:var(--acc);animation:blink .7s infinite}
.sync[data-s="local"] i{background:var(--mute)}
.ibtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--rule2);background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:grid;place-items:center;transition:border-color .3s,transform .5s var(--spring)}
.ibtn:hover{border-color:var(--ink);transform:rotate(30deg) scale(1.06)}
.ibtn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* canvas tools */
.tools{position:absolute;z-index:15;left:var(--gx);bottom:calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;align-items:flex-start;transition:opacity .5s}
.zoom{display:flex;gap:6px}
.zoom button{height:34px;min-width:34px;padding:0 12px;border-radius:99px;border:1px solid var(--rule2);background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-family:var(--mono);font-size:12px;transition:border-color .3s,transform .4s var(--spring)}
.zoom button:hover{border-color:var(--ink);transform:translateY(-2px)}
.zoom button:active{transform:scale(.92)}
.legend{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.legend .eyebrow{margin-right:4px}
.fbtn{height:28px;padding:0 12px;border-radius:99px;border:1px solid var(--rule2);background:var(--glass);font-size:12px;color:var(--mute);transition:all .35s var(--ease);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.fbtn:hover{border-color:var(--ink);color:var(--ink)}
.fbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hint{font-family:var(--mono);font-size:10px;color:var(--mute);letter-spacing:.06em}

/* ledger */
.ledger{position:absolute;z-index:10;right:var(--gxr);top:calc(68px + env(safe-area-inset-top,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:340px;display:flex;flex-direction:column;padding:20px 18px 0;border:1px solid var(--rule2);border-radius:22px;background:var(--glass);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);box-shadow:0 30px 60px -34px var(--shadow);transition:opacity .6s var(--ease),transform .8s var(--ease);animation:slideIn 1.1s var(--ease) .25s backwards}
.big{margin-top:4px;font-family:var(--serif);font-size:92px;line-height:.82;letter-spacing:-.04em;display:flex;align-items:flex-start;gap:4px}
.big sup{font-size:.26em;letter-spacing:0;margin-top:.3em;color:var(--mute);font-style:italic}
.sb{display:flex;gap:3px;height:7px;margin:14px 0 10px}
.sb i{flex:var(--t) 1 0;background:var(--rule);position:relative;border-radius:4px;overflow:hidden}
.sb i b{position:absolute;inset:0 auto 0 0;width:var(--w,0%);background:var(--dc);border-radius:4px;transition:width 1.4s var(--ease)}
.subl{font-family:var(--mono);font-size:10.5px;color:var(--mute);line-height:1.6}
.next{margin-top:10px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--mute)}
.next button{font-family:var(--serif);font-style:italic;font-size:20px;color:var(--ink);text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:4px;text-decoration-color:var(--acc);transition:letter-spacing .4s var(--ease)}
.next button:hover{letter-spacing:.01em}
.sess{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;margin-top:14px;padding:10px 12px 10px 10px;border-radius:18px;background:color-mix(in srgb,var(--ink) 5%,transparent);border:1px solid var(--rule)}
.sring{position:relative;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;transition:transform .5s var(--spring)}
.sring:hover{transform:scale(1.07)}
.sring:active{transform:scale(.94)}
.sring svg{position:absolute;inset:0;width:100%;height:100%}
.sbg{fill:none;stroke:var(--rule2);stroke-width:4}
.sfg{fill:none;stroke:var(--acc);stroke-width:4;stroke-linecap:round;stroke-dasharray:0 176;transition:stroke-dasharray .6s linear}
.sico{position:relative;width:16px;height:16px;display:grid;place-items:center}
.sico svg{position:static;width:16px;height:16px;fill:var(--ink)}
.sess.run .sring{animation:ringPulse 2.4s ease-out infinite}
.sname{font-family:var(--serif);font-size:21px;line-height:1.05;margin-top:2px}
.sess .subl{margin-top:2px}
.idx{margin-top:16px;padding-top:12px;border-top:1px solid var(--rule)}
.areas{list-style:none;margin:6px 0 0;padding:0 0 30px;overflow:auto;flex:1;scrollbar-width:none;mask-image:linear-gradient(#000 calc(100% - 30px),transparent);-webkit-mask-image:linear-gradient(#000 calc(100% - 30px),transparent)}
.areas::-webkit-scrollbar{display:none}
.areas li{border-bottom:1px solid var(--rule);padding:12px 0;animation:rise .9s var(--ease) backwards;animation-delay:calc(var(--i)*70ms + 400ms)}
.a-row{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:baseline}
.a-row .ix{font-family:var(--mono);font-size:10px;color:var(--faint)}
.a-row .nm{font-family:var(--serif);font-size:22px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a-row .pc{font-family:var(--mono);font-size:12px;text-align:right}
.a-row .pc::after{content:"%";color:var(--faint)}
.a-prog{height:2px;background:var(--rule);margin:9px 0 0 32px;position:relative;border-radius:2px}
.a-prog i{position:absolute;left:0;top:0;height:2px;width:var(--w,0%);background:var(--dc);border-radius:2px;transition:width 1.4s var(--ease)}
.rits{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0 32px}
.rit{display:inline-flex;align-items:center;gap:7px;height:27px;padding:0 11px 0 8px;border-radius:99px;border:1px solid var(--rule2);font-size:12px;color:var(--mute);transition:all .4s var(--spring);background:transparent}
.rit i{width:11px;height:11px;border-radius:50%;border:1px solid currentColor;transition:all .35s var(--ease);position:relative;overflow:hidden;flex:none}
.rit i::after{content:"";position:absolute;left:0;right:0;bottom:0;height:var(--p,0%);background:var(--dc);transition:height 1s var(--ease)}
.rit:hover{border-color:var(--dc);color:var(--ink);transform:translateY(-2px)}
.rit[aria-pressed="true"]{color:var(--ink);border-color:var(--dc);background:color-mix(in srgb,var(--dc) 16%,transparent)}
.rit[aria-pressed="true"] i{background:var(--dc);border-color:var(--dc);box-shadow:0 0 0 3px color-mix(in srgb,var(--dc) 24%,transparent)}
.led-foot{display:flex;gap:8px;padding:12px 0 16px;border-top:1px solid var(--rule);flex-wrap:wrap}
.btn{height:34px;padding:0 16px;border-radius:99px;background:var(--ink);color:var(--bg);font-size:12.5px;font-weight:500;transition:transform .4s var(--spring)}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:scale(.95)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--rule2)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 45%,transparent)}
.lnk{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);transition:color .3s}
.lnk:hover{color:var(--ink)}

/* drawer */
.drawer{position:absolute;z-index:40;top:0;right:0;bottom:0;width:min(580px,100%);background:var(--bg);border-left:1px solid var(--rule2);display:flex;flex-direction:column;transform:translateX(104%);transition:transform 1s var(--ease),visibility 0s 1s;visibility:hidden;box-shadow:-40px 0 80px -40px var(--shadow)}
.app.open .drawer{transform:none;visibility:visible;transition:transform 1s var(--ease),visibility 0s}
.app.open .ledger{opacity:0;transform:translateX(40px) scale(.98);pointer-events:none}
.drawer::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(90deg,var(--dc),color-mix(in srgb,var(--dc) 30%,transparent))}
.dr-head{padding:calc(24px + env(safe-area-inset-top,0px)) 32px 0;position:relative}
.dr-head .close{z-index:3;background:var(--card);position:absolute;right:24px;top:calc(24px + env(safe-area-inset-top,0px));width:36px;height:36px;border-radius:50%;border:1px solid var(--rule2);display:grid;place-items:center;transition:transform .6s var(--spring),border-color .3s}
.dr-head .close:hover{transform:rotate(90deg);border-color:var(--ink)}
.dr-head .close svg{width:14px;height:14px;stroke:currentColor;stroke-width:1.6;fill:none;stroke-linecap:round}
.dr-head h1{margin:12px 0 0;padding-right:48px;font-family:var(--serif);font-weight:400;font-size:clamp(42px,6.4vw,66px);line-height:.92;letter-spacing:-.03em;overflow-wrap:anywhere;text-wrap:balance}
.dr-head h1 em{color:color-mix(in srgb,var(--dc) 75%,var(--ink));font-style:italic}
.dr-head .note{font-family:var(--serif);font-style:italic;font-size:18px;color:var(--mute);margin:12px 0 0;line-height:1.35;max-width:48ch}
.app.open .dr-head>*{animation:rise .9s var(--ease) backwards}
.app.open .dr-head h1{animation-delay:.12s}
.app.open .dr-head .note{animation-delay:.2s}
.dr-stats{display:grid;grid-template-columns:repeat(4,1fr);margin:20px 0 0;border-top:1px solid var(--rule2);border-bottom:1px solid var(--rule)}
.dr-stats div{padding:12px 0;border-right:1px solid var(--rule);min-width:0}
.dr-stats div+div{padding-left:14px}
.dr-stats div:last-child{border-right:0}
.dr-stats b{display:block;font-family:var(--serif);font-size:30px;font-weight:400;line-height:1}
.dr-stats small{font-size:16px;color:var(--mute)}

.grp-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--rule2);padding-bottom:8px}
.grp-h h3{margin:0;font-family:var(--serif);font-weight:400;font-size:26px;letter-spacing:-.01em}
.ck{list-style:none;margin:0;padding:0}
.ck li{border-bottom:1px solid var(--rule);animation:rise .6s var(--ease) backwards;animation-delay:calc(var(--j,0)*28ms + 120ms)}
.ci{display:grid;grid-template-columns:20px minmax(0,1fr);gap:14px;align-items:start;padding:12px 0;cursor:pointer;font-size:14px;line-height:1.45;transition:transform .4s var(--ease)}

.check:hover{border-color:var(--dc);transform:scale(1.12)}

.check:checked::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.ci:has(.check:checked) span{color:var(--faint);text-decoration:line-through;text-decoration-thickness:1px}
.prose{font-size:14px;color:var(--mute);line-height:1.65;margin:6px 0 14px;max-width:56ch}
.deliver{font-family:var(--serif);font-size:26px;line-height:1.18;margin:8px 0 6px;letter-spacing:-.01em;text-wrap:pretty}
.field{width:100%;border:0;border-bottom:1.5px solid var(--rule2);background:transparent;padding:8px 2px;border-radius:0;font-family:var(--serif);font-size:19px;line-height:1.5;resize:vertical;min-height:90px;transition:border-color .3s}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0}

/* views */
.view{position:absolute;z-index:8;left:var(--gx);right:calc(var(--gxr) + 372px);top:calc(70px + env(safe-area-inset-top,0px));bottom:0;overflow:auto;padding:20px 12px calc(60px + env(safe-area-inset-bottom,0px)) 0;scrollbar-width:thin}

.view.vin{animation:viewIn .9s var(--ease) backwards}
.view h2{margin:8px 0 0;font-family:var(--serif);font-weight:400;font-size:clamp(40px,5vw,64px);line-height:.95;letter-spacing:-.03em;text-wrap:balance}

.blk h3{margin:0;font-family:var(--serif);font-weight:400;font-size:32px;line-height:1.02;letter-spacing:-.01em}
.blk .out{font-size:13.5px;color:var(--mute);line-height:1.6;margin:10px 0 0;max-width:60ch}
.sec-h{font-family:var(--serif);font-size:34px;font-weight:400;margin:40px 0 4px;letter-spacing:-.01em}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0 28px}
.trk{padding:14px 0;border-bottom:1px solid var(--rule)}
.trk h4{margin:0 0 6px;font-family:var(--serif);font-weight:400;font-size:22px}
.trk p{margin:0;font-size:13px;color:var(--mute);line-height:1.55}
.rt{display:grid;grid-template-columns:62px minmax(0,1fr);gap:16px;padding:14px 0;border-bottom:1px solid var(--rule);align-items:baseline}
.rt b{font-family:var(--serif);font-weight:400;font-size:36px;line-height:1}
.rt b small{font-family:var(--mono);font-size:10px;color:var(--mute);margin-left:2px}
.rt h4{margin:0;font-family:var(--serif);font-weight:400;font-size:21px}
.rt p{margin:3px 0 0;font-size:13px;color:var(--mute);line-height:1.5}
.proj{display:grid;grid-template-columns:20px minmax(0,1fr);gap:16px;padding:22px 0;border-bottom:1px solid var(--rule);animation:rise .8s var(--ease) backwards;animation-delay:calc(var(--i)*55ms + 120ms)}
.proj .check{margin-top:8px}
.proj h3{margin:0;font-family:var(--serif);font-weight:400;font-size:28px;line-height:1.05;letter-spacing:-.01em;transition:color .4s}
.proj .tag{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-right:10px}
.proj.done h3{color:var(--faint);text-decoration:line-through;text-decoration-thickness:1px}
.proj ol{margin:10px 0 0;padding-left:18px;font-size:13.5px;color:var(--mute);line-height:1.65}
.proj .prv{margin:10px 0 0;font-family:var(--serif);font-style:italic;font-size:18px;color:var(--ink)}

.veil{position:absolute;inset:0;z-index:60;background:color-mix(in srgb,var(--bg) 55%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;padding:20px var(--gxr) 20px var(--gx);animation:fade .4s both}
.veil[hidden]{display:none}
.modal{width:min(440px,100%);background:var(--card);border:1px solid var(--rule2);border-radius:22px;padding:28px;animation:rise .8s var(--spring) both;box-shadow:0 40px 80px -30px var(--shadow)}

.app[data-view="map"] .view{display:none}
.app:not([data-view="map"]) .map,.app:not([data-view="map"]) .tools{opacity:0;pointer-events:none}

@keyframes rise{from{opacity:0;transform:translateY(16px)}}

@keyframes spin{to{transform:rotate(360deg)}}

@keyframes pulseHalo{0%{opacity:.4;transform:scale(.9)}100%{opacity:0;transform:scale(1.8)}}
@keyframes breathe{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.9)}}
@keyframes rip{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(2.8)}}
@keyframes tick{0%{transform:scale(.7)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes ringPulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--acc) 45%,transparent)}100%{box-shadow:0 0 0 14px color-mix(in srgb,var(--acc) 0%,transparent)}}
.top{animation:fade 1.2s var(--ease) .1s backwards}

.scroll{display:contents}
.spacer{display:none}

@media (max-width:860px){
  .map{height:58%;bottom:auto}
  .brand b{font-size:26px}
  .brand em,.sync span{display:none}
  .top{flex-wrap:wrap;row-gap:10px}
  .modes{order:3;width:100%;margin:0;justify-content:space-between}
  .modes button{flex:1;padding:0 6px}
  .tools{bottom:auto;top:calc(104px + env(safe-area-inset-top,0px));left:var(--gx);right:var(--gxr);flex-direction:row;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px}
  .hint{display:none}
  .app[data-view="map"] .tools{top:auto;bottom:calc(42% + 10px)}
  .scroll{display:block;position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;z-index:10;pointer-events:none;overscroll-behavior:contain}
  .scroll>*{pointer-events:auto}
  .spacer{display:block;height:58%;pointer-events:none}

  .ledger{position:relative;left:auto;right:auto;top:auto;bottom:auto;width:auto;margin:0;padding:18px var(--gxr) calc(40px + env(safe-area-inset-bottom,0px)) var(--gx);background:var(--bg);backdrop-filter:none;-webkit-backdrop-filter:none;display:block;border:0;border-top:1px solid var(--rule2);border-radius:22px 22px 0 0;box-shadow:0 -20px 40px -30px var(--shadow)}
  .areas{overflow:visible;mask-image:none;-webkit-mask-image:none}
  .big{font-size:84px}
  .view{right:var(--gxr);top:calc(112px + env(safe-area-inset-top,0px));padding-right:0}
  .blk{grid-template-columns:1fr;gap:6px}
  .blk .when{padding-top:0;flex-direction:row;align-items:center}
  .drawer{top:auto;height:94%;width:100%;border-left:0;border-top:1px solid var(--rule2);border-radius:22px 22px 0 0;transform:translateY(104%)}
  .dr-head{padding:26px 20px 0}

  .dr-body{padding:20px 20px 40px}
  .field{font-size:17px}
  .app.open .ledger{transform:none}
  .tip{display:none}
}

 [["Finance concepts",["Horizontal and vertical analysis","Profitability, liquidity and leverage ratios","Efficiency and working-capital ratios","Operating cash flow and free cash flow","Earnings quality and financial red flags","Comparing performance across years and peers"]],

var dbDoc=null, saving=false, dirty=false, saveT=0;
function setSync(s){var el=$("#sync"); el.dataset.s=s; $("#syncT").textContent=s==="synced"?"Saved to account":s==="saving"?"Saving":"On this device"}
function persist(){
  S.t=Date.now();
  try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
  if(!dbDoc){setSync("local");return}
  setSync("saving"); dirty=true; clearTimeout(saveT); saveT=setTimeout(flush,700);
}
function flush(){
  if(saving||!dbDoc||!dirty)return;
  saving=true; dirty=false;
  dbDoc.set({state:S}).then(function(){saving=false; if(dirty){flush()}else{setSync("synced")}}).catch(function(){saving=false; setSync("local")});
}
function initDb(){
  try{
    var cl=window.claude; if(!cl||!cl.use)return;
    Promise.all([cl.use("db"),cl.use("user")]).then(function(r){
      var db=r[0],user=r[1]; if(!db||!user)return null;
      return user.id().then(function(id){
        if(!id)return null;
        dbDoc=db.doc("data/users/"+id+"/state");
        return dbDoc.get().then(function(snap){
          if(snap.exists){
            var rem=snap.data()&&snap.data().state;
            if(rem&&rem.c&&(rem.t||0)>(S.t||0)){
              var ls=S.s||{}; S=rem; norm();
              Object.keys(ls).forEach(function(d){if((ls[d]||0)>(S.s[d]||0))S.s[d]=ls[d]});
              try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
              updateAll(); renderSess(); if(openId)renderDrawer(); renderView();
            }else if(S.t){dirty=true;flush();return}
          }else if(S.t){dirty=true;flush();return}
          setSync("synced");
        });
      });
    }).catch(function(){setSync("local")});
  }catch(e){}
}

var cam={x:0,y:0,k:.5}, tg={x:0,y:0,k:.5}, vel={x:0,y:0}, dragging=false, moved=false, ptrs={}, startPt=null, startCam=null, pinchD=0, lastMoveT=0, saveCam=null;

function fitTarget(){
  var r=svg.getBoundingClientRect(), desk=window.innerWidth>860;
  var rw=desk?(window.innerWidth>1100?372:332):0;
  var availW=r.width-rw, topPad=desk?60:96, availH=r.height-topPad-(desk?10:50);
  var k=Math.min(availW/1340,availH/1340); if(!desk)k=Math.max(k,.36);
  k=Math.max(.3,k);

}
function fit(instant){
  var f=fitTarget(); tg.x=f.x; tg.y=f.y; tg.k=f.k; vel.x=vel.y=0;

}
function zoomAt(cx,cy,f,direct){

  var k2=Math.min(2.8,Math.max(.28,tg.k*f)), s=k2/tg.k;

}
function pcount(){return Object.keys(ptrs).length}
function plist(){return Object.keys(ptrs).map(function(k){return ptrs[k]})}
function pdist(){var a=plist(); return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}

svg.addEventListener("pointerdown",function(e){
  hideTip(); ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
  if(pcount()===1){startPt={x:e.clientX,y:e.clientY}; startCam={x:cam.x,y:cam.y}; moved=false; vel.x=vel.y=0; tg.x=cam.x; tg.y=cam.y; tg.k=cam.k}
  else if(pcount()===2){pinchD=pdist(); moved=true; dragging=true}
});
svg.addEventListener("pointermove",function(e){
  if(!ptrs[e.pointerId])return;
  ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
  if(pcount()===2){var d=pdist(), m=pmid(); if(pinchD>0)zoomAt(m.x,m.y,d/pinchD,true); pinchD=d; return}
  if(pcount()===1&&startPt){
    var dx=e.clientX-startPt.x, dy=e.clientY-startPt.y;
    if(moved||Math.hypot(dx,dy)>5){
      if(!moved){moved=true; dragging=true; svg.classList.add("drag"); try{svg.setPointerCapture(e.pointerId)}catch(_){}}
      var nx=startCam.x+dx, ny=startCam.y+dy, now=performance.now(), dtm=Math.max(8,now-(lastMoveT||now-16));
      vel.x=(nx-cam.x)/dtm*16*.6+vel.x*.4; vel.y=(ny-cam.y)/dtm*16*.6+vel.y*.4; lastMoveT=now;

function endPtr(e){

/* ---------- number tweens ---------- */
var tws=[];
function tweenNum(elm,to,suf){
  if(!elm)return; suf=suf||""; var from=elm._v==null?0:elm._v; elm._v=to;
  if(reduced||from===to){elm.textContent=to+suf;return}
  tws=tws.filter(function(x){return x.el!==elm});
  tws.push({el:elm,from:from,to:to,suf:suf,t0:performance.now(),d:1100});
}
function stepTweens(now){
  if(!tws.length)return;
  tws=tws.filter(function(x){
    var p=Math.min(1,(now-x.t0)/x.d), e=p===1?1:1-Math.pow(2,-10*p);
    x.el.textContent=Math.round(x.from+(x.to-x.from)*e)+x.suf;
    return p<1;
  });
}

function toast(m){var t=$("#toast"); t.textContent=m; t.classList.add("on"); clearTimeout(toastT); toastT=setTimeout(function(){t.classList.remove("on")},2800)}
$("#copyBtn").addEventListener("click",function(){
  var out="Finance Atlas syllabus\n";
  NODES.forEach(function(nd){
    out+="\n"+nd.n+". "+nd.name+" (level "+nd.lvl+", about "+nd.wk+" weeks)\n";
    nd.groups.forEach(function(g,gi){out+=g[0]+":\n"; g[1].forEach(function(t,ii){out+=(S.c[ck(nd.id,gi,ii)]?"[x] ":"[ ] ")+t+"\n"})});
  });
  try{navigator.clipboard.writeText(out).then(function(){toast("Syllabus copied")},function(){toast("Copying is blocked in this view")})}catch(e){toast("Copying is blocked in this view")}
});
function veil(html,after){
  var v=$("#veil"); v.innerHTML=html; v.hidden=false;
  v.onclick=function(e){if(e.target===v||e.target.closest("[data-x]")){v.hidden=true}};
  if(after)after(v);
}
$("#resetBtn").addEventListener("click",function(){
  veil('<div class="modal" role="dialog" aria-modal="true" aria-labelledby="rt"><h3 id="rt">Reset all progress?</h3><p>Every ticked topic, mastery check, finished project, note and study streak will be cleared. This cannot be undone.</p><div class="acts"><button class="btn ghost" data-x="1">Keep it</button><button class="btn danger" id="doReset">Reset everything</button></div></div>',function(v){
    v.querySelector("#doReset").addEventListener("click",function(){S={c:{},n:{},s:{},t:0}; persist(); v.hidden=true; updateAll(); renderSess(); if(openId)renderDrawer(); renderView(); toast("Progress cleared")});
  });
});
$("#themeBtn").addEventListener("click",function(){
  var cur=root.dataset.theme||(DARK?"dark":"light"), nx=cur==="dark"?"light":"dark";
  root.dataset.theme=nx;
  try{localStorage.setItem(LS+"-theme",nx)}catch(e){}
});
document.addEventListener("keydown",function(e){
  if(e.key!=="Escape")return;
  if(!$("#veil").hidden){$("#veil").hidden=true;return}
  if(openId)closeDrawer();
});

/* ---------- study session timer ---------- */
function pad(n){return n<10?"0"+n:""+n}
function dayKey(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function secToday(){return Math.floor(S.s[dayKey(new Date())]||0)}
function streak(){
  var n=0, d=new Date(); if(secToday()<1200)d.setDate(d.getDate()-1);
  while(n<400&&(S.s[dayKey(d)]||0)>=1200){n++; d.setDate(d.getDate()-1)}
  return n;
}
var SESS={run:false,i:0,left:ROUTINE[0][0]*60,last:0,acc:0};
var ICO_PLAY='<svg viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z"/></svg>', ICO_PAUSE='<svg viewBox="0 0 16 16"><path d="M3.5 2.5h3v11h-3zM9.5 2.5h3v11h-3z"/></svg>';
function fmt(s){s=Math.max(0,Math.ceil(s)); return pad(Math.floor(s/60))+":"+pad(s%60)}
function renderSess(){
  var blk=ROUTINE[SESS.i], tot=blk[0]*60, sec=secToday(), st=streak();
  $("#sess").classList.toggle("run",SESS.run);
  $("#sIco").innerHTML=SESS.run?ICO_PAUSE:ICO_PLAY;
  $("#sFg").style.strokeDasharray=((1-SESS.left/tot)*176).toFixed(1)+" 176";
  $("#sLab").textContent=SESS.run?"Block "+(SESS.i+1)+" of "+ROUTINE.length+" · "+fmt(SESS.left):(SESS.left<tot?"Paused":"Today");
  $("#sName").textContent=SESS.run||SESS.left<tot?blk[1]:"Start your 90 minutes";
  $("#sSub").textContent=Math.floor(sec/60)+" of 90 min today · "+(st?st+"-day streak":"20 min keeps a streak alive");
  $("#sSkip").hidden=!(SESS.run||SESS.left<tot);
}
$("#sBtn").addEventListener("click",function(){
  SESS.run=!SESS.run; SESS.last=Date.now();
  if(!SESS.run){persist()}
  renderSess();
});
$("#sSkip").addEventListener("click",function(){advanceBlock(false)});
function advanceBlock(finished){
  if(finished){var r=$("#sBtn").getBoundingClientRect(); burst(r.left+26,r.top+26,PAL[0],26,4.5)}
  SESS.i++;
  if(SESS.i>=ROUTINE.length){SESS.i=0; SESS.run=false; SESS.left=ROUTINE[0][0]*60; persist(); toast(finished?"90 minutes done. Good session.":"Session ended"); renderSess(); return}
  SESS.left=ROUTINE[SESS.i][0]*60; if(finished)toast("Next: "+ROUTINE[SESS.i][1]); renderSess();
}
setInterval(function(){
  if(!SESS.run)return;
  var now=Date.now(), el=Math.min(5,Math.max(0,(now-SESS.last)/1000)); SESS.last=now;
  SESS.left-=el; var k=dayKey(new Date()); S.s[k]=(S.s[k]||0)+el; SESS.acc+=el;
  if(SESS.acc>=20){SESS.acc=0; persist()}
  if(SESS.left<=0){advanceBlock(true)} else renderSess();
},500);

/* ---------- canvases: living background and particles ---------- */
var bg=$("#bg"), bctx=bg.getContext&&bg.getContext("2d"), fxc=$("#fx"), fctx=fxc.getContext&&fxc.getContext("2d"), DPR=1, CW=0, CH=0;
function sizeCanvases(){
  DPR=Math.min(2,window.devicePixelRatio||1); CW=window.innerWidth; CH=window.innerHeight;
  [bg,fxc].forEach(function(c){c.width=Math.round(CW*DPR); c.height=Math.round(CH*DPR)});
  if(bctx)bctx.setTransform(DPR,0,0,DPR,0,0); if(fctx)fctx.setTransform(DPR,0,0,DPR,0,0);
  bgDirty=true;
}
var ORBS=[
 {c:0,x:.12,y:.18,r:.46,ax:.07,ay:.06,sx:.13,sy:.1,p:0},
 {c:3,x:.78,y:.14,r:.5,ax:.06,ay:.08,sx:.09,sy:.12,p:1.7},
 {c:2,x:.5,y:.55,r:.42,ax:.09,ay:.05,sx:.07,sy:.11,p:3.1},
 {c:4,x:.9,y:.7,r:.46,ax:.05,ay:.07,sx:.11,sy:.08,p:4.6},
 {c:1,x:.18,y:.82,r:.44,ax:.08,ay:.05,sx:.1,sy:.09,p:2.4},
 {c:6,x:.62,y:.92,r:.36,ax:.07,ay:.04,sx:.12,sy:.1,p:5.3}
];
var AP=[0,0,0,0,0,0,0], pxT=0, pyT=0, px=0, py=0, bgBoost=0;
function bumpBg(){bgBoost=1}
function rgba(c,a){return "rgba("+c[0]+","+c[1]+","+c[2]+","+a+")"}
function drawBg(t){
  if(!bctx)return;
  var w=CW, h=CH;
  bctx.clearRect(0,0,w,h);
  var ao=DARK?.15:.24;
  for(var i=0;i<ORBS.length;i++){
    var o=ORBS[i], x=(o.x+Math.sin(t*o.sx+o.p)*o.ax+px*.025*(i%2?1:-1))*w, y=(o.y+Math.cos(t*o.sy+o.p)*o.ay+py*.025)*h, r=o.r*Math.max(w,h)*(1+.05*Math.sin(t*.4+o.p));
    var g=bctx.createRadialGradient(x,y,0,x,y,r); g.addColorStop(0,rgba(PAL[o.c],ao)); g.addColorStop(1,rgba(PAL[o.c],0));
    bctx.fillStyle=g; bctx.fillRect(0,0,w,h);
  }
  /* strata ribbons: seven currents, thickness follows progress */
  var step=14, n=Math.ceil(w/step)+1, base=new Float32Array(n), top=new Float32Array(n), k, a, i2;
  for(k=0;k<n;k++)base[k]=h+6;
  for(a=0;a<AREAS.length;a++){
    var tgt=areaStats(AREAS[a]).p/100; AP[a]+=(tgt-AP[a])*(reduced?1:.035);
    var th=h*(.014+.034*AP[a]);
    bctx.beginPath();
    for(k=0;k<n;k++){
      var x2=k*step, wv=1+.5*Math.sin(x2*.0042+t*.55+a*1.3)+.22*Math.sin(x2*.0115-t*.85+a*.7);
      top[k]=base[k]-th*wv;
      if(k===0)bctx.moveTo(x2,top[k]); else bctx.lineTo(x2,top[k]);
    }
    for(i2=n-1;i2>=0;i2--)bctx.lineTo(i2*step,base[i2]);
    bctx.closePath(); bctx.fillStyle=rgba(PAL[a],DARK?.3:.42); bctx.fill();
    for(k=0;k<n;k++)base[k]=top[k];
  }
}
var parts=[];
function burst(x,y,rgb,n,pw){
  if(reduced||!fctx)return;
  for(var i=0;i<n;i++){var a=Math.random()*6.283, s=(Math.random()*.6+.4)*pw; parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-pw*.4,l:1,c:rgb,z:2+Math.random()*3.5})}
}
function drawFx(){
  if(!fctx)return;
  if(!parts.length){if(fx_dirty){fctx.clearRect(0,0,CW,CH);fx_dirty=false} return}
  fx_dirty=true; fctx.clearRect(0,0,CW,CH);
  parts=parts.filter(function(p){
    p.vy+=.13; p.x+=p.vx; p.y+=p.vy; p.vx*=.985; p.l-=.017;
    if(p.l<=0)return false;
    fctx.fillStyle=rgba(p.c,Math.max(0,p.l)); fctx.beginPath(); fctx.arc(p.x,p.y,p.z*Math.min(1,p.l+.3),0,6.283); fctx.fill();
    return true;
  });
}
var fx_dirty=false;
window.addEventListener("pointermove",function(e){
  pxT=(e.clientX/window.innerWidth-.5)*2; pyT=(e.clientY/window.innerHeight-.5)*2;
  if(e.pointerType==="mouse"){spotT.x=e.clientX; spotT.y=e.clientY; $("#spot").classList.add("on")}
},{passive:true});
root.addEventListener("mouseleave",function(){$("#spot").classList.remove("on")});
var spotT={x:-400,y:-400}, spotC={x:-400,y:-400};

/* ---------- frame loop ---------- */
var raf=0, lastT=0;
function frame(t){
  raf=0;
  var dt=Math.min(60,t-(lastT||t-16)); lastT=t;
  if(!dragging&&(vel.x||vel.y)){tg.x+=vel.x; tg.y+=vel.y; vel.x*=.92; vel.y*=.92; if(Math.abs(vel.x)<.05)vel.x=0; if(Math.abs(vel.y)<.05)vel.y=0}
  if(!dragging){
    var e=reduced?1:1-Math.pow(.0001,dt/1000);
    var dx=tg.x-cam.x, dy=tg.y-cam.y, dk=tg.k-cam.k;
    if(Math.abs(dx)>.01||Math.abs(dy)>.01||Math.abs(dk)>.0001){cam.x+=dx*e; cam.y+=dy*e; cam.k+=dk*e; applyCam()}
  }
  px+=(pxT-px)*.04; py+=(pyT-py)*.04;
  spotC.x+=(spotT.x-spotC.x)*.14; spotC.y+=(spotT.y-spotC.y)*.14;
  if(!reduced)$("#spot").style.transform="translate3d("+spotC.x.toFixed(1)+"px,"+spotC.y.toFixed(1)+"px,0)";
  stepTweens(t);
  if(!reduced||bgDirty){drawBg(t/1000); bgDirty=false}
  drawFx();
  if(!document.hidden)raf=requestAnimationFrame(frame);
}
document.addEventListener("visibilitychange",function(){if(!document.hidden&&!raf){lastT=0;raf=requestAnimationFrame(frame)}});

/* ---------- boot ---------- */
function updateAll(soft){bgDirty=true; updateMap(); updateLedger(); if($("#app").dataset.view!=="map"&&soft!==true)renderView()}
$("#brandB").innerHTML="Finance Atlas".split("").map(function(c,i){return '<span style="--i:'+i+'">'+(c===" "?"&nbsp;":c)+'</span>'}).join("");
readPal(); sizeCanvases();
buildMap(); buildLedger(); updateAll(); renderSess();
var startV=(location.hash||"").slice(1); setView(VIEWS.indexOf(startV)>-1?startV:"map",true);
(function intro(){
  var f=fitTarget(); tg.x=f.x; tg.y=f.y; tg.k=f.k;
  cam.x=f.x; cam.y=f.y+60; cam.k=f.k*(reduced?1:.55); applyCam();
})();
var rzT=0;
window.addEventListener("resize",function(){
  placeInk(); sizeCanvases(); clearTimeout(rzT);
  rzT=setTimeout(function(){if(!openId)fit(false)},200);
});
if(document.fonts&&document.fonts.ready){document.fonts.ready.then(placeInk)}
setSync("local"); initDb();
raf=requestAnimationFrame(frame);

})();
</script>
